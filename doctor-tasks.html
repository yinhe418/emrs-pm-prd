<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务列表</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app">
    <div class="navbar">
      <button class="back" onclick="location.href='doctor-home.html'"><span style="font-size:22px; font-weight:700; line-height:1;">‹</span></button>
      <div class="title">任务列表</div>
      <div class="actions"></div>
    </div>

    <div class="page" style="padding-top:0;">
      <div style="display:flex; gap:8px; padding:12px 16px; background:white; border-bottom:1px solid var(--line); overflow-x:auto;">
        <button class="btn btn-sm btn-primary">未完成 3</button>
        <button class="btn btn-sm btn-outline">已完成</button>
        <button class="btn btn-sm btn-outline">需医生判断 2</button>
        <button class="btn btn-sm btn-outline">全部</button>
      </div>

      <div class="page">
        <!-- 需医生判断(转交) -->
        <div class="section-title" style="color:var(--block);">需医生判断(护士转交)</div>
        <div class="group">
          <a href="doctor-task-detail.html" class="cell" style="background:#FFEBEE;">
            <div class="l">
              <div class="icon"><img src="assets/icons-png/icon-alert.png" alt="!" /></div>
              <div class="info">
                <b>陈丙英 · LDL-C 1.95 异常</b>
                <span>由护士甲转交 · 2025-12-27 11:00</span>
              </div>
            </div>
            <div class="r"><span class="badge badge-block">需判断</span><span class="arrow">›</span></div>
          </a>
          <a href="doctor-task-detail.html" class="cell" style="background:#FFEBEE;">
            <div class="l">
              <div class="icon"><img src="assets/icons-png/icon-alert.png" alt="!" /></div>
              <div class="info">
                <b>刘文 · 阿司匹林胃部不适</b>
                <span>由护士乙转交 · 2025-12-27 10:30</span>
              </div>
            </div>
            <div class="r"><span class="badge badge-block">需判断</span><span class="arrow">›</span></div>
          </a>
        </div>

        <!-- 阶段复核 -->
        <div class="section-title">阶段复核</div>
        <div class="group">
          <a href="doctor-task-detail.html" class="cell">
            <div class="l">
              <div class="icon"><img src="assets/icons-png/icon-calendar.png" alt="历" /></div>
              <div class="info">
                <b>张桂兰 · 30 天复核</b>
                <span>需安排 mRS + 血脂评估</span>
              </div>
            </div>
            <div class="r"><span class="badge badge-warn">截止 D30</span><span class="arrow">›</span></div>
          </a>
          <a href="doctor-task-detail.html" class="cell">
            <div class="l">
              <div class="icon"><img src="assets/icons-png/icon-calendar.png" alt="历" /></div>
              <div class="info">
                <b>陈丙英 · 7 天随访复核</b>
                <span>护士甲 7 天随访记录待复核</span>
              </div>
            </div>
            <div class="r"><span class="arrow">›</span></div>
          </a>
        </div>

        <!-- 下发任务提醒 -->
        <div class="section-title">可下发任务</div>
        <div class="card">
          <div class="card-title">主动发起随访 / 检查</div>
          <a href="doctor-issue-task.html" class="btn btn-primary btn-block" style="margin-top:8px;">+ 下发新任务</a>
          <div style="margin-top:8px; font-size:11px; color:var(--ink-3);">
            可选:记录血压 / 血脂 / 复查某项检查报告
          </div>
        </div>
      </div>
    </div>

    <div class="tabbar">
      <a href="doctor-home.html" class="tab"><span <img src="assets/icons-png/icon-tab-home.png" alt="首" />主页</a>
      <a href="doctor-tasks.html" class="tab active"><span <img src="assets/icons-png/icon-tab-tasks.png" alt="任" />任务</a>
      <a href="doctor-patients.html" class="tab"><span <img src="assets/icons-png/icon-tab-people.png" alt="患" />患者</a>
      <a href="role-switch.html" class="tab"><span <img src="assets/icons-png/icon-tab-switch.png" alt="切" />切换</a>
    </div>
  </div>
  <script src="assets/layout.js"></script>
</body>
</html>
