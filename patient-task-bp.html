<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>记录血压</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app">
    <div class="navbar">
      <button class="back" onclick="location.href='patient-tasks.html'"><span style="font-size:22px; font-weight:700; line-height:1;">‹</span></button>
      <div class="title">记录血压</div>
      <div class="actions"></div>
    </div>

    <div class="page">
      <div class="banner">
        <b>个人目标:血压 &lt; 130/80 mmHg</b>
        由您的医生甲为您设定。记录后将自动对比目标。
      </div>

      <div class="card" style="background:var(--block-bg); border:none;">
        <div style="font-size:13px; color:var(--block);">
          <b>已逾期 3 小时</b> · 连续 3 天未记录,护士甲将电话提醒您。
        </div>
      </div>

      <!-- 老人友好快速录入(OCR + 语音) -->
      <div class="quick-input-card">
        <div class="quick-input-title">🚀 快速录入(老人友好)</div>
        <div class="quick-input-row">
          <button type="button" class="quick-input-btn" onclick="mockOCR()" aria-label="上传血压计照片自动识别">
            <div class="ico">📷</div>
            <div class="lbl">上传照片识别</div>
            <div class="sub">拍血压计即可</div>
          </button>
          <button type="button" class="quick-input-btn" onclick="mockVoice()" aria-label="语音录入">
            <div class="ico">🎤</div>
            <div class="lbl">语音录入</div>
            <div class="sub">"135 82" 即可</div>
          </button>
        </div>
        <div class="quick-input-foot">
          Q2 真实接入(腾讯云 OCR / 腾讯云 ASR 16k_zh_medical) · 当前为 Mock
        </div>
      </div>

      <div class="group">
        <div class="form-item">
          <span class="form-label"><span class="req">*</span>收缩压(高压)</span>
          <input class="form-input" type="number" id="bpHigh" placeholder="60-250" style="font-size:24px; font-weight:600;">
        </div>
        <div class="form-item">
          <span class="form-label"><span class="req">*</span>舒张压(低压)</span>
          <input class="form-input" type="number" id="bpLow" placeholder="30-150" style="font-size:24px; font-weight:600;">
        </div>
        <div class="form-item">
          <span class="form-label">心率(选填)</span>
          <input class="form-input" type="number" id="bpHr" placeholder="30-220">
        </div>
        <div class="form-item">
          <span class="form-label">测量时间</span>
          <input class="form-input" type="datetime-local" id="bpTime" value="2025-12-27T08:30">
        </div>
        <div class="form-item">
          <span class="form-label">测量体位</span>
          <select class="form-select">
            <option>坐位</option>
            <option>卧位</option>
            <option>站位</option>
          </select>
        </div>
      </div>

      <div class="card" style="background:var(--info-bg); border:none;">
        <div style="font-size:12px; color:var(--info);">
          <b>如何测量?</b> 安静休息 5 分钟后,坐位测量上臂血压,连续 2 次取均值。
          详细步骤可在 <a href="patient-edu.html" style="color:var(--info);">健康教育</a> 查看。
        </div>
      </div>

      <a href="patient-tasks.html" class="btn btn-primary btn-block" style="margin-top:20px;">
        保存记录
      </a>
      <a href="patient-tasks.html" class="btn btn-outline btn-block" style="margin-top:8px;">
        取消
      </a>
    </div>
  </div>
  <script src="assets/layout.js"></script>
  <script>
    // ─────────────────────────────────────────────
    // 老人友好快速录入(Mock · Q2 真实接入)
    // ─────────────────────────────────────────────
    var toastEl = null;
    function showToast(msg, loading) {
      if (!toastEl) {
        toastEl = document.createElement('div');
        toastEl.className = 'quick-input-toast';
        document.body.appendChild(toastEl);
      }
      toastEl.className = 'quick-input-toast show' + (loading ? ' loading' : '');
      toastEl.textContent = msg;
      if (!loading) {
        setTimeout(function () {
          if (toastEl) toastEl.className = 'quick-input-toast';
        }, 2200);
      }
    }
    function hideToast() {
      if (toastEl) toastEl.className = 'quick-input-toast';
    }

    function setBusy(btn, busy) {
      btn.disabled = busy;
      btn.style.opacity = busy ? '0.55' : '1';
      btn.style.cursor = busy ? 'wait' : 'pointer';
    }

    function mockOCR() {
      var btn = document.querySelector('.quick-input-btn[onclick="mockOCR()"]');
      setBusy(btn, true);
      showToast('正在识别血压计照片', true);
      setTimeout(function () {
        document.getElementById('bpHigh').value = 135;
        document.getElementById('bpLow').value = 82;
        document.getElementById('bpHr').value = 76;
        setBusy(btn, false);
        hideToast();
        showToast('识别成功 · 血压 135/82 · 请确认数值');
      }, 2200);
    }

    function mockVoice() {
      var btn = document.querySelector('.quick-input-btn[onclick="mockVoice()"]');
      setBusy(btn, true);
      showToast('正在聆听,请说"血压 135 82"', true);
      setTimeout(function () {
        document.getElementById('bpHigh').value = 135;
        document.getElementById('bpLow').value = 82;
        document.getElementById('bpHr').value = 76;
        setBusy(btn, false);
        hideToast();
        showToast('识别成功 · "血压 135 82,心率 76"');
      }, 2800);
    }
  </script>
</body>
</html>
