<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 智病历 AIS 管理后台</title>
  <link rel="stylesheet" href="assets/back.css">
</head>
<body data-noshell class="login-body">

  <!-- 左侧品牌区(Q1 占位色块,正式视觉由 UI agent 提供) -->
  <div class="login-brand">
    <div class="lb-mark">智</div>
    <div>
      <h1>智病历 AIS<br>管理后台</h1>
      <p class="lb-sub">
        卒中患者全程管理软件 · 医院侧配置平台<br>
        组织与人员 · 任务组件库 · 药品主数据
      </p>
    </div>
    <div class="lb-foot">
      ⚠️ 独立于小程序端的 PC Web 系统 · 登录态不互通
    </div>
  </div>

  <!-- 右侧登录表单 -->
  <div class="login-panel">
    <div class="login-box">
      <h2>管理员登录</h2>
      <p class="lb-t">请使用科室分配的后台账号登录</p>

      <!-- 账号 / 密码放进 form:密码框脱离 form 会让 Chrome 控制台报
           「Password field is not contained in a form」。提交按钮通过 form 属性关联。 -->
      <form id="loginForm" novalidate>
        <div class="fi" id="fi-user">
          <label for="u"><span class="req">*</span>账号</label>
          <input class="ipt w-full" id="u" name="user" placeholder="后台账号" autocomplete="username">
          <span class="err-msg">请输入账号</span>
        </div>

        <div class="fi" id="fi-pwd">
          <label for="p"><span class="req">*</span>密码</label>
          <input class="ipt w-full" id="p" name="pwd" type="password" placeholder="请输入密码" autocomplete="current-password">
          <span class="err-msg">请输入密码</span>
        </div>
      </form>

      <div class="fi" id="fi-err" style="display:none">
        <div class="note note-block" style="margin:0" id="errBox"></div>
      </div>

      <!-- ⚠️ 「记住我」当前**没有实现**:令牌存 sessionStorage,关掉标签页即失效。
           后端只给了 expiresIn,没有给 refresh_token / 持久化会话接口,
           所以这个勾选框暂时不改变任何行为 —— 不假装它是生效的。 -->
      <label class="chk mb-12" title="本轮令牌存 sessionStorage(关掉标签页即失效);后端尚未提供刷新令牌 / 持久化会话接口,此勾选暂不改变行为">
        <input type="checkbox" checked> 记住我(7 天内免登录)
      </label>

      <button class="btn btn-primary" id="loginBtn" type="submit" form="loginForm">登 录</button>

      <!-- Demo 提示:演示时隐藏。需要演示异常态时,删掉下面这行 style="display:none" 即可。
           ⚠️ 登录已接真后端(POST /api/adm/v1/auth/login),账号由后端 mkadmin 工具创建,
              这里不再写死口令 —— 演示前请用真实账号登录。 -->
      <div class="login-demo" style="display:none">
        <b>Demo 提示</b><br>
        账号 <code class="k">admin</code> · 口令由后端 <code class="k">mkadmin</code> 工具创建<br>
        连错 5 次会锁定账号(错误码 <code class="k">40103</code>),这是后端的真实行为
      </div>

      <div class="divider"></div>
      <p class="fz-12 text-3" style="line-height:1.8">
        本系统仅供医院授权人员使用,操作全程留痕。<br>
        如需开通账号,请联系科室主任 / 医务科。
      </p>
      <p class="fz-12 mt-12"><a href="index.html" style="color:var(--brand)">← 返回小程序端入口</a></p>
    </div>
  </div>

  <script src="assets/back-api.js"></script>
  <script>
    (function () {
      var errBox = document.getElementById('errBox');
      var fiErr = document.getElementById('fi-err');
      var btn = document.getElementById('loginBtn');

      function showErr(sel, msg) {
        var fi = document.querySelector(sel);
        fi.classList.add('has-err');
        fi.querySelector('.err-msg').textContent = msg;
      }
      function clearErr() {
        document.querySelectorAll('.fi').forEach(function (f) { f.classList.remove('has-err'); });
        fiErr.style.display = 'none';
      }
      /* 后端错误展示:把 §13.3 的错误码与文案都摆出来,便于对着后端日志查 */
      function showApiErr(err) {
        var html = '<b>' + BackApi.esc(BackApi.errorText(err)) + '</b>';
        if (err && err.unreachable) {
          html += '<br>请确认本地静态服务器(serve.py)与后端 admin-api 都在运行。';
        } else if (err && err.requestId) {
          html += '<br>请求 ID:' + BackApi.esc(err.requestId);
        }
        fiErr.style.display = 'block';
        errBox.innerHTML = html;
      }

      function doLogin() {
        clearErr();
        var u = document.getElementById('u').value.trim();
        var p = document.getElementById('p').value;
        if (!u) { showErr('#fi-user', '请输入账号'); return; }
        if (!p) { showErr('#fi-pwd', '请输入密码'); return; }

        /* loading 态:按钮置灰,避免重复提交 */
        btn.disabled = true;
        btn.textContent = '登录中…';

        /* ⚠️ 走真实后端 POST /api/adm/v1/auth/login(经 serve.py 反代)。
         *    成功后把令牌 + 用户信息存 sessionStorage,再跳工作台。 */
        BackApi.login(u, p).then(function (data) {
          BackApi.saveSession(data);
          location.href = 'back-dashboard.html';
        }).catch(function (err) {
          btn.disabled = false;
          btn.textContent = '登 录';
          showApiErr(err);
        });
      }

      /* 走 form 的 submit 事件(回车 = 浏览器隐式提交),不再绑 click,避免重复执行 */
      var form = document.getElementById('loginForm');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        doLogin();
      });

      /* 默认填账号(口令由后端 mkadmin 创建,不预填) */
      document.getElementById('u').value = 'admin';
    })();
  </script>
</body>
</html>
