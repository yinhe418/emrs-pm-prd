<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 智病历 AIS 管理后台</title>
  <link rel="stylesheet" href="assets/back.css">
</head>
<body data-noshell class="login-body">

  <!-- 左侧品牌区(Q1 占位色块,正式视觉由 UI agent 提供) -->
  <div class="login-brand">
    <div class="lb-mark">智</div>
    <div>
      <h1>智病历 AIS<br>管理后台</h1>
      <p class="lb-sub">
        卒中患者全程管理软件 · 医院侧配置平台<br>
        组织与人员 · 任务组件库 · 预警规则 · 药品主数据
      </p>
    </div>
    <div class="lb-foot">
      ⚠️ 独立于小程序端的 PC Web 系统 · 登录态不互通 · Q1 阶段为 HTML Demo,数据为演示数据
    </div>
  </div>

  <!-- 右侧登录表单 -->
  <div class="login-panel">
    <div class="login-box">
      <h2>管理员登录</h2>
      <p class="lb-t">请使用科室分配的后台账号登录</p>

      <div class="fi" id="fi-user">
        <label for="u"><span class="req">*</span>账号</label>
        <input class="ipt w-full" id="u" name="user" placeholder="后台账号" autocomplete="username">
        <span class="err-msg">请输入账号</span>
      </div>

      <div class="fi" id="fi-pwd">
        <label for="p"><span class="req">*</span>密码</label>
        <input class="ipt w-full" id="p" name="pwd" type="password" placeholder="请输入密码" autocomplete="current-password">
        <span class="err-msg">请输入密码</span>
      </div>

      <div class="fi" id="fi-err" style="display:none">
        <div class="note note-block" style="margin:0" id="errBox"></div>
      </div>

      <label class="chk mb-12"><input type="checkbox" checked> 记住我(7 天内免登录)</label>

      <button class="btn btn-primary" id="loginBtn">登 录</button>

      <div class="login-demo">
        <b>Demo 提示</b><br>
        账号 <code class="k">admin</code> · 密码 <code class="k">123456</code>(任意非空账号密码均可进入)<br>
        输入 <code class="k">error</code> 可查看「账号或密码不正确」异常态
      </div>

      <div class="divider"></div>
      <p class="fz-12 text-3" style="line-height:1.8">
        本系统仅供医院授权人员使用,操作全程留痕。<br>
        如需开通账号,请联系科室主任 / 医务科。
      </p>
      <p class="fz-12 mt-12"><a href="index.html" style="color:var(--brand)">← 返回小程序端 Demo 入口</a></p>
    </div>
  </div>

  <script>
    (function () {
      var btn = document.getElementById('loginBtn');
      var errBox = document.getElementById('errBox');
      var fiErr = document.getElementById('fi-err');

      function showErr(sel, msg) {
        var fi = document.querySelector(sel);
        fi.classList.add('has-err');
        fi.querySelector('.err-msg').textContent = msg;
      }
      function clearErr() {
        document.querySelectorAll('.fi').forEach(function (f) { f.classList.remove('has-err'); });
        fiErr.style.display = 'none';
      }

      function doLogin() {
        clearErr();
        var u = document.getElementById('u').value.trim();
        var p = document.getElementById('p').value.trim();
        if (!u) { showErr('#fi-user', '请输入账号'); return; }
        if (!p) { showErr('#fi-pwd', '请输入密码'); return; }

        // Demo:error 触发异常态
        if (u === 'error' || p === 'error') {
          fiErr.style.display = 'block';
          errBox.innerHTML = '⚠️ <b>账号或密码不正确</b><br>为防止账号枚举,不区分是账号还是密码错误。'
            + '连续 5 次错误将锁定 15 分钟。';
          return;
        }
        // Demo:locked 触发锁定态
        if (u === 'locked') {
          fiErr.style.display = 'block';
          errBox.innerHTML = '🔒 <b>账号已临时锁定</b><br>连续 5 次密码错误,已锁定 15 分钟,请稍后再试。';
          return;
        }
        location.href = 'back-hospital-pick.html';
      }

      btn.addEventListener('click', doLogin);
      document.getElementById('p').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') doLogin();
      });

      // 默认填充 Demo 账号,方便点击验收
      document.getElementById('u').value = 'admin';
      document.getElementById('p').value = '123456';
    })();
  </script>
</body>
</html>
