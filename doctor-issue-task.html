<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>下发任务</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app">
    <div class="navbar">
      <button class="back" onclick="location.href='doctor-patient-detail.html'"><span style="font-size:22px; font-weight:700; line-height:1;">‹</span></button>
      <div class="title">下发任务 · 陈丙英</div>
      <div class="actions"></div>
    </div>

    <div class="page">
      <div class="banner">
        <b>任务库(task 库)</b>
        可插拔组件。选中的任务将进入患者任务中心,按组件定义字段录入。
      </div>

      <div class="section-title">选择任务</div>
      <div class="group">
        <div class="cell" style="background:var(--brand-light);">
          <div class="l">
            <div class="icon"><img src="assets/icons-png/icon-info.png" alt="诊" /></div>
            <div class="info"><b>记录血压</b><span>每日 1-3 次 · 自动对比目标</span></div>
          </div>
          <div class="r"><input type="checkbox" checked></div>
        </div>
        <div class="cell">
          <div class="l">
            <div class="icon"><img src="assets/icons-png/icon-bp.png" alt="血" /></div>
            <div class="info"><b>复查血脂全套</b><span>选定日期 · 上传报告</span></div>
          </div>
          <div class="r"><input type="checkbox"></div>
        </div>
        <div class="cell">
          <div class="l">
            <div class="icon"><img src="assets/icons-png/icon-tab-drugs.png" alt="药" /></div>
            <div class="info"><b>服药反馈</b><span>每日 · 医嘱 vs 实际</span></div>
          </div>
          <div class="r"><input type="checkbox" checked></div>
        </div>
        <div class="cell">
          <div class="l">
            <div class="icon"><img src="assets/icons-png/icon-call.png" alt="电" /></div>
            <div class="info"><b>电话回访</b><span>7/30/90 天 · 护士完成</span></div>
          </div>
          <div class="r"><input type="checkbox"></div>
        </div>
        <div class="cell">
          <div class="l">
            <div class="icon"><img src="assets/icons-png/icon-transfer.png" alt="动" /></div>
            <div class="info"><b>康复训练打卡</b><span>每日步行 · 患者打卡</span></div>
          </div>
          <div class="r"><input type="checkbox"></div>
        </div>
      </div>

      <div class="section-title">任务参数</div>
      <div class="group">
        <div class="form-item">
          <span class="form-label"><span class="req">*</span>起始日期</span>
          <input class="form-input" type="date" value="2025-12-28">
        </div>
        <div class="form-item">
          <span class="form-label">截止日期(选填)</span>
          <input class="form-input" type="date" value="2026-03-14">
        </div>
        <div class="form-item">
          <span class="form-label">频率</span>
          <select class="form-select">
            <option>每日</option>
            <option>每周</option>
            <option>单次</option>
          </select>
        </div>
        <div class="form-item">
          <span class="form-label">负责人</span>
          <select class="form-select">
            <option>陈丙英(患者)</option>
            <option>护士甲(主要联系护士)</option>
            <option>主管医生(您)</option>
          </select>
        </div>
        <div class="form-item">
          <span class="form-label">备注(选填)</span>
          <textarea class="form-textarea" id="issueNote" placeholder="如:D45 重点关注 LDL-C..." style="min-height:96px;"></textarea>
          <button type="button" class="voice-input-wide" onclick="mockVoiceIssue()" id="voiceIssueBtn" aria-label="语音录入备注">
            <span class="ico">🎤</span>
            <span>点击语音录入</span>
          </button>
        </div>
      </div>

      <div class="card" style="background:var(--info-bg); border:none;">
        <div style="font-size:12px; color:var(--info);">
          任务将进入患者任务中心,<b>未完成置顶,周期截止未完成也置顶</b>(§7.1)。
        </div>
      </div>

      <a href="doctor-patient-detail.html" class="btn btn-primary btn-block" style="margin-top:20px;">
        下发
      </a>
    </div>
  </div>
  <script src="assets/layout.js"></script>
  <script>
    var issueToastEl = null;
    function showIssueToast(msg) {
      if (!issueToastEl) {
        issueToastEl = document.createElement('div');
        issueToastEl.className = 'quick-input-toast';
        issueToastEl.style.background = 'rgba(46, 125, 50, 0.95)';
        document.body.appendChild(issueToastEl);
      }
      issueToastEl.className = 'quick-input-toast show';
      issueToastEl.textContent = msg;
      setTimeout(function () { if (issueToastEl) issueToastEl.className = 'quick-input-toast'; }, 2000);
    }

    function mockVoiceIssue() {
      var btn = document.getElementById('voiceIssueBtn');
      btn.disabled = true;
      btn.querySelector('.ico').textContent = '⏳';
      btn.querySelector('span:last-child').textContent = '正在聆听…(请说)';
      setTimeout(function () {
        document.getElementById('issueNote').value =
          '重点关注 D45 血脂复查结果。患者近期 LDL-C 反弹,' +
          '若仍未达标考虑加强化他汀方案。同时关注血压控制,' +
          '若连续 3 天收缩压超过 140 提前安排随访。';
        btn.disabled = false;
        btn.querySelector('.ico').textContent = '🎤';
        btn.querySelector('span:last-child').textContent = '点击语音录入';
        showIssueToast('识别成功 · 请确认内容');
      }, 2500);
    }
  </script>
</body>
</html>
