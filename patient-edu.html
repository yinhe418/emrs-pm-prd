<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>健康教育</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app">
    <div class="navbar">
      <button class="back" onclick="location.href='patient-home.html'"><span style="font-size:22px; font-weight:700; line-height:1;">‹</span></button>
      <div class="title">健康教育</div>
      <div class="actions">
        <div class="font-toggle" id="fontToggle" aria-label="字号切换">
          <button data-size="normal" onclick="setFontSize('normal', this)">小</button>
          <button data-size="large" onclick="setFontSize('large', this)">中</button>
          <button data-size="xl" onclick="setFontSize('xl', this)">大</button>
        </div>
      </div>
    </div>

    <div class="page">
      <div class="banner">
        <b>卒中后再发警示</b>
        掌握关键症状,识别后立即拨打 120
      </div>

      <div class="group" id="eduList"></div>

      <div class="card" style="background:var(--info-bg); border:none;">
        <div style="font-size:12px; color:var(--info);">
          以上内容由后台「健康教育」栏目发布,后台调整后会同步到这里。
        </div>
      </div>
    </div>

    <div class="tabbar">
      <a href="patient-home.html" class="tab active"><span <img src="assets/icons-png/icon-tab-home.png" alt="首" />首页</a>
      <a href="patient-tasks.html" class="tab"><span <img src="assets/icons-png/icon-tab-tasks.png" alt="任" />任务</a>
      <a href="patient-im.html" class="tab"><span <img src="assets/icons-png/icon-im.png" alt="信" />联系</a>
      <a href="patient-emergency.html" class="tab" style="color:var(--block);"><span <img src="assets/icons-png/icon-sos.png" alt="急" />紧急</a>
    </div>
  </div>
  <script src="assets/edu-data.js"></script>
  <script src="assets/layout.js"></script>
  <script src="assets/font-size.js"></script>
  <script>
    /* 列表由后台「健康教育」栏目驱动:只展示已发布的内容 */
    (function () {
      function currentHospitalId() {
        try { return localStorage.getItem('emrs.currentHospitalId') || 'H1'; }
        catch (e) { return 'H1'; }
      }
      function esc(s) {
        return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
      function render() {
        var box = document.getElementById('eduList');
        if (!box) return;
        var list = EDU_DATA.published(currentHospitalId());
        if (!list.length) {
          box.innerHTML = '<div class="card" style="text-align:center;">'
            + '<div style="font-size:14px; color:var(--ink-2); font-weight:500;">暂无健康教育内容</div>'
            + '<div style="font-size:12px; color:var(--ink-3); margin-top:6px;">内容由医院后台发布,发布后这里会自动出现</div>'
            + '</div>';
          return;
        }
        box.innerHTML = list.map(function (a) {
          var ic = a.icon && EDU_DATA.ICONS.indexOf(a.icon) >= 0 ? a.icon : 'icon-document.png';
          return '<a href="patient-edu-detail.html?id=' + encodeURIComponent(a.id) + '" class="cell">'
            + '<div class="l">'
            +   '<div class="icon"><img src="assets/icons-png/' + ic + '" alt="" /></div>'
            +   '<div class="info"><b>' + esc(a.title) + '</b><span>' + esc(a.subtitle) + '</span></div>'
            + '</div>'
            + '<div class="r"><span class="arrow">›</span></div>'
            + '</a>';
        }).join('');
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', render);
      } else {
        render();
      }
    })();
  </script>
</body>
</html>
