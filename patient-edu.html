<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>健康教育</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app">
    <div class="navbar">
      <button class="back" onclick="location.href='patient-home.html'"><span style="font-size:22px; font-weight:700; line-height:1;">‹</span></button>
      <div class="title">健康教育</div>
      <div class="actions"></div>

      <div class="group">
        <a href="patient-edu.html" class="cell">

          <div class="r"><span class="arrow">›</span></div>
        </a>
        <a href="patient-edu.html" class="cell">
          <div class="l">
            <div class="icon"><img src="assets/icons-png/icon-tab-drugs.png" alt="药" /></div>

          </div>
          <div class="r"><span class="arrow">›</span></div>
        </a>
        <a href="patient-edu.html" class="cell">
          <div class="l">
            <div class="icon"><img src="assets/icons-png/icon-info.png" alt="诊" /></div>
            <div class="info"><b>血压 / 血脂管理</b><span>达标标准 · 测量方法</span></div>
          </div>
          <div class="r"><span class="arrow">›</span></div>
        </a>
        <a href="patient-edu.html" class="cell">
          <div class="l">
            <div class="icon">烟</div>
            <div class="info"><b>戒烟 / 限酒</b><span>二级预防核心</span></div>

          <div class="r"><span class="arrow">›</span></div>
        </a>
        <a href="patient-edu.html" class="cell">
          <div class="l">
            <div class="icon">食</div>
            <div class="info"><b>饮食指导</b><span>低盐低脂 · 营养均衡</span></div>
          </div>
          <div class="r"><span class="arrow">›</span></div>
        </a>
        <a href="patient-edu.html" class="cell">
          <div class="l">
            <div class="icon"><img src="assets/icons-png/icon-transfer.png" alt="动" /></div>
            <div class="info"><b>康复训练</b><span>被动运动 · 步行训练</span></div>
          </div>
          <div class="r"><span class="arrow">›</span></div>
        </a>
      </div>

      <div class="card" style="background:var(--info-bg); border:none;">
        <div style="font-size:12px; color:var(--info);">
          <b>P2 占位</b>:教育内容具体清单待临床确认后填充(PRD §9)。
        </div>
      </div>

    <div class="tabbar">
      <a href="patient-home.html" class="tab active"><span <img src="assets/icons-png/icon-tab-home.png" alt="首" />首页</a>
      <a href="patient-tasks.html" class="tab"><span <img src="assets/icons-png/icon-tab-tasks.png" alt="任" />任务</a>
      <a href="patient-im.html" class="tab"><span <img src="assets/icons-png/icon-im.png" alt="信" />联系</a>
      <a href="patient-emergency.html" class="tab" style="color:var(--block);"><span <img src="assets/icons-png/icon-sos.png" alt="急" />紧急</a>
