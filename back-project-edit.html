<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新建项目 · 后台管理</title>
  <link rel="stylesheet" href="assets/back.css">
  <style>
    /* ==========================================================
     * 项目任务编排区(PC 版)
     * 产品形态对齐移动端 admin-project-edit.html 的「任务卡 + 两个维度」,
     * 但按 PC 宽度重排:组件信息在左,两个维度同排在一行里。
     * ⚠️ 只用 back.css 的设计令牌,不自造颜色体系。
     * ========================================================== */
    .tmpl {
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      background: var(--bg-2);
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .tmpl.pending { border-color: var(--warn-border); background: var(--warn-bg); }
    .tmpl.off      { background: var(--bg-3); }
    .tmpl.off .tmpl-info b { color: var(--ink-3); text-decoration: line-through; }
    .tmpl-head { display: flex; align-items: center; gap: 10px; }
    .tmpl-ic {
      width: 32px; height: 32px; border-radius: var(--r-md); background: var(--brand-light);
      display: grid; place-items: center; flex: none; overflow: hidden;
    }
    .tmpl-ic img { width: 20px; height: 20px; }
    .tmpl-info { flex: 1; min-width: 0; }
    .tmpl-info b { display: block; font-size: 13.5px; font-weight: 600; color: var(--ink); }
    .tmpl-acts { display: flex; align-items: center; gap: 12px; flex: none; }
    .tmpl-dims {
      margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line);
      display: flex; gap: 26px; flex-wrap: wrap; align-items: flex-start;
    }
    .dim-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .dim-lab { width: 46px; flex: none; font-size: 12px; color: var(--ink-3); }
    .pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 11px; border: 1px solid var(--line); border-radius: var(--r-pill);
      font-size: 12px; color: var(--ink-2); cursor: pointer; background: #fff;
      transition: all .12s ease;
    }
    .pill:hover { border-color: var(--brand); }
    .pill:has(input:checked) { background: var(--brand-light); border-color: var(--brand); color: var(--brand-dark); font-weight: 500; }
    .pill input[type=radio] { margin: 0; accent-color: var(--brand); cursor: pointer; }
    .pill .dayn { width: 48px; height: 24px; padding: 0 6px; text-align: center; }
    .chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 11px; border: 1px solid var(--line); border-radius: var(--r-pill);
      font-size: 12px; color: var(--ink-2); cursor: pointer; background: #fff;
      transition: all .12s ease;
    }
    .chip:hover { border-color: var(--brand); }
    .chip:has(input:checked) { background: var(--brand-light); border-color: var(--brand); color: var(--brand-dark); font-weight: 500; }
    .chip input { margin: 0; accent-color: var(--brand); cursor: pointer; }
    .dim-hint { flex: 0 0 100%; font-size: 11.5px; color: var(--ink-3); line-height: 1.55; }
    .tmpl-err { font-size: 11.5px; color: var(--block-ink); font-weight: 500; }
    /* 抽屉里的多选表格 */
    .pick-note { font-size: 11.5px; color: var(--ink-3); margin-top: 4px; }
  </style>
</head>
<body data-page="projects" data-crumb='[{"name":"后台管理"},{"name":"任务"},{"href":"back-projects.html","name":"项目管理"},{"name":"新建项目"}]'>

<main class="back-main has-sticky">

  <div class="page-head">
    <h1 id="ttl">新建项目</h1>
    <div class="sub">项目归属<b>一个科室</b>;项目任务在患者入组后自动生成。</div>
  </div>

  <div id="scopeStrip"></div>

  <!-- ============ 基本信息 ============ -->
  <div class="card">
    <div class="card-head"><h3>基本信息</h3></div>
    <div class="form-grid">
      <div class="fi">
        <label><span class="req">*</span>归属科室</label>
        <select class="sel" name="dept"></select>
        <span class="err-msg">请选择归属科室</span>
      </div>
      <div class="fi">
        <label><span class="req">*</span>项目主题</label>
        <input class="ipt" name="name" placeholder="2–100 字,例:90 天卒中连续健康管理">
        <span class="err-msg">项目主题 2–100 字</span>
      </div>
      <div class="fi">
        <label><span class="req">*</span>项目类型</label>
        <select class="sel" name="tag">
          <option value="管理">管理</option>
          <option value="研究">研究</option>
        </select>
      </div>
      <div class="fi">
        <label><span class="req">*</span>主负责医生</label>
        <select class="sel" name="lead"></select>
        <span class="err-msg">请选择主负责医生</span>
      </div>
      <div class="fi">
        <label><span class="req">*</span>项目周期</label>
        <div style="display:flex; gap:8px;">
          <select class="sel" name="durPreset" style="flex:none; width:120px;">
            <option value="90">90 天</option>
            <option value="180">180 天</option>
            <option value="365">365 天</option>
            <option value="custom">自定义</option>
            <option value="longterm">长期</option>
          </select>
          <input class="ipt" name="duration" type="number" min="1" max="3650" style="flex:1;" disabled>
        </div>
        <span class="err-msg">项目周期不合法,请重新填写</span>
      </div>
      <div class="fi">
        <label><span class="req">*</span>开始日期</label>
        <input class="ipt" name="startDate" type="date">
        <span class="err-msg">请选择开始日期</span>
      </div>
      <div class="fi">
        <label><span class="req" id="endReq">*</span>结束日期</label>
        <input class="ipt" name="endDate" type="date">
        <span class="err-msg">结束日期不得早于开始日期</span>
      </div>
      <div class="fi">
        <label>定价(元)</label>
        <input class="ipt" name="price" type="number" min="0" max="99999999.99" step="0.01" placeholder="0.00">
        <span class="err-msg">定价不能为负数</span>
      </div>
    </div>
  </div>

  <!-- ============ 项目任务 ============ -->
  <div class="card" id="templates">
    <div class="card-head">
      <h3>项目任务(项目直接绑组件)</h3>
      <span class="ch-desc" id="tplCount">0 条</span>
      <div class="ch-right">
        <button class="btn btn-default btn-sm" id="pickBtn"><img src="assets/icons-png/icon-plus.png" alt="">从任务组件库添加</button>
      </div>
    </div>

    <div class="note note-info">
      <img src="assets/icons-png/icon-info.png">
      <div>患者入组后按此配置<b>自动生成</b>任务;顺序即患者端展示顺序。</div>
    </div>

    <div id="tplList"></div>

  </div>

  <div class="sticky-actions">
    <a class="btn btn-default" href="back-projects.html">取消</a>
    <span class="ml-auto"></span>
    <button class="btn btn-primary" id="saveBtn">保存项目</button>
  </div>
</main>

<!-- ========== 从任务库添加组件 抽屉 ========== -->
<div class="drawer-mask" id="pickMask"></div>
<div class="drawer wide" id="pickDrawer" data-mask="pickMask">
  <div class="drawer-head">
    <h3>从任务库添加组件</h3>
    <button class="d-close">×</button>
  </div>
  <div class="drawer-body">
    <div class="filters" style="margin-bottom:12px;">
      <div class="search-wrap">
        <img src="assets/icons-png/icon-search.png" alt="">
        <input class="ipt search-ipt" id="pickKw" placeholder="组件名称">
      </div>
      <label class="switch" style="margin-left:4px;">
        <input type="checkbox" id="onlyMine" checked><span class="sw-track"></span><span class="sw-lab">仅本科室组件</span>
      </label>
    </div>

    <div class="card flat">
      <div class="tbl-wrap">
        <table class="tbl">
          <thead>
            <tr>
              <th style="width:34px"></th>
              <th style="width:180px">组件名称</th>
              <th style="width:120px">归属科室</th>
              <th>字段构成</th>
              <th style="width:80px">状态</th>
            </tr>
          </thead>
          <tbody id="pickBody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="drawer-foot">
    <span class="fz-12 text-3" id="pickCount">已选 0 个</span>
    <div class="df-right">
      <button class="btn btn-default" onclick="Back.drawer('pickDrawer',false)">取消</button>
      <button class="btn btn-primary" id="pickOk">确定添加</button>
    </div>
  </div>
</div>

<!-- ========== 移除项目任务 弹窗 ========== -->
<div class="modal-mask" id="delModal">
  <div class="modal">
    <div class="modal-head">
      <img src="assets/icons-png/icon-warning.png" alt="">
      <h3>移除项目任务</h3>
    </div>
    <div class="modal-body" id="delBody"></div>
    <div class="modal-foot">
      <button class="btn btn-default" onclick="Back.modal('delModal',false)">取消</button>
      <button class="btn btn-danger" id="delOk">确认移除</button>
    </div>
  </div>
</div>

<script src="assets/back-api.js"></script>
<script src="assets/back-data.js"></script>
<script src="assets/projects.js"></script>
<script src="assets/back-project-data.js"></script>
<script src="assets/back-layout.js"></script>
<script>
  var id = Back.qs('id');
  var proj = id ? BACK_PROJ.byId(id) : null;
  var isEdit = !!proj;

  /* 项目任务编辑态(改完保存才落库) */
  var tpls = isEdit ? JSON.parse(JSON.stringify(BACK_PROJ.tasksOf(proj.id))) : [];
  var picked = {};   /* 抽屉里勾选的组件 id */

  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function curDeptId() {
    var el = document.querySelector('[name="dept"]');
    return el && el.value ? String(el.value) : '';
  }
  /* ---------- 周期(预设 / 自定义 / 长期)----------
   * ⚠️ 2026-11-05 用户提:「项目周期 是不是可以增加一个长期 …就没有结束时间,只能手动结束」
   * 产品语义:周期取值 = 「1–3650 天」| 「长期」
   *    · 长期 ⇒ **没有结束时间**、**不会自动到期 / 不自动停用** ⇒ 要有终点只能**手动结束**
   *    · 长期 ⇒ 单次档「第 N 天」**不再受周期上限约束**
   *    · 转换路径:取消「长期」+ 选一个有限周期天数 + 填结束日期 ⇒ 回到普通项目规则
   * ⚠️ 「长期」在 DB / API 怎么存(0 / NULL / 加列)**由 AR 定** —— 原型只表达产品语义,
   *    页面一律按 `longTerm` 标记判定,不做「0 = 长期」之类的假设。 */
  function isLongTerm() {
    var el = document.querySelector('[name="durPreset"]');
    return !!el && el.value === 'longterm';
  }
  function durationDays() {
    var preset = document.querySelector('[name="durPreset"]').value;
    if (preset === 'longterm') return 0;          /* 长期 = 没有固定天数 */
    if (preset === 'custom') return Number(document.querySelector('[name="duration"]').value || 0);
    return Number(preset || 0);
  }
  /* 预设联动:长期 ⇒ 天数禁用 / 结束日期禁用并清空 + 提示改写 */
  function applyDurPreset() {
    var preset = document.querySelector('[name="durPreset"]');
    var num = document.querySelector('[name="duration"]');
    var ed = document.querySelector('[name="endDate"]');
    var lt = preset.value === 'longterm';
    num.disabled = preset.value !== 'custom';
    if (preset.value !== 'custom') num.value = '';
    if (lt) { ed.disabled = true; ed.value = ''; } else { ed.disabled = false; }
    document.getElementById('endReq').style.display = lt ? 'none' : '';
  }
  /* ---------- 归属科室下拉 ---------- */
  (function () {
    var sel = document.querySelector('[name="dept"]');
    sel.insertAdjacentHTML('afterbegin', '<option value="">请选择归属科室…</option>');
    BACK_DATA.deptListByHospital((Back.currentHospital() || {}).id).forEach(function (d) {
      if (d.status !== 1) return;
      sel.insertAdjacentHTML('beforeend', '<option value="' + d.id + '">' + esc(d.name) + '</option>');
    });
    if (isEdit) {
      sel.value = String(proj.departmentId);
      /* 归属科室保存后不可修改 ⇒ 编辑态锁定 */
      sel.disabled = true;
    }
  })();

  /* ---------- 主负责医生下拉(限归属科室) ---------- */
  function fillLead(keep) {
    var sel = document.querySelector('[name="lead"]');
    var did = curDeptId();
    sel.innerHTML = '<option value="">请选择主负责医生…</option>';
    if (!did) return;
    BACK_DATA.staffWithRole('doctor').forEach(function (s) {
      if (s.status !== 1) return;                       /* 在职 */
      if (String(s.departmentId) !== String(did)) return; /* 本科室 */
      sel.insertAdjacentHTML('beforeend', '<option value="' + s.id + '">' + esc(s.name) + '</option>');
    });
    if (keep) sel.value = keep;
  }
  document.querySelector('[name="dept"]').addEventListener('change', function () { fillLead(''); });

  /* ---------- 周期 ---------- */
  (function () {
    var preset = document.querySelector('[name="durPreset"]');
    var num = document.querySelector('[name="duration"]');
    preset.addEventListener('change', function () { applyDurPreset(); });
    if (isEdit) {
      if (proj.longTerm) {
        preset.value = 'longterm';
      } else {
        preset.value = String(proj.durationDays);
        if (['90', '180', '365'].indexOf(preset.value) < 0) {
          preset.value = 'custom'; num.disabled = false; num.value = proj.durationDays;
        }
      }
    }
    applyDurPreset();
  })();

  /* ---------- 回填 ---------- */
  if (isEdit) {
    document.getElementById('ttl').textContent = '编辑项目 · ' + proj.name;
    document.querySelector('[name="name"]').value = proj.name;
    document.querySelector('[name="tag"]').value = proj.tag || '管理';
    document.querySelector('[name="startDate"]').value = proj.startDate || '';
    document.querySelector('[name="endDate"]').value = proj.endDate || '';
    document.querySelector('[name="price"]').value = proj.price != null ? proj.price : '';
    fillLead(String(proj.leadDoctorId || ''));
  } else {
    document.getElementById('ttl').textContent = '新建项目';
    var ps = document.querySelector('[name="startDate"]');
    var pe = document.querySelector('[name="endDate"]');
    ps.value = '2026-11-01'; pe.value = '2027-01-30';
  }

  /* ==========================================================
   * 项目任务编排区
   * ========================================================== */
  /* 角色位单选组(执行人 / 下一步跟踪人)
   * ⚠️ 2026-11-05 执行层重新设计:原来是「目标人三选多」,现改为两个**单选**字段。
   *    跟踪人额外多一个「无」= 执行完成即结束,不产生跟踪环节、不发跟踪通知。 */
  function roleRadios(kind, tid, cur) {
    var name = kind + '-' + tid;   /* kind: ex 执行人 / tr 跟踪人 */
    /* 🔴 2026-11-05:执行人三选一(必填);跟踪人**只列医生 / 护士**(⛔ 不含患者),另加「无」。 */
    var list = kind === 'tr' ? BACK_PROJ.TRACKER_ROLES : BACK_PROJ.EXECUTOR_ROLES;
    var html = list.map(function (r) {
      return '<label class="chip"><input type="radio" name="' + name + '" data-' + kind + '="' + tid + '"'
        + ' value="' + r.key + '"' + (cur === r.key ? ' checked' : '') + '><span>' + r.label + '</span></label>';
    }).join('');
    if (kind === 'tr') {
      html += '<label class="chip"><input type="radio" name="' + name + '" data-tr="' + tid + '"'
        + ' value=""' + (!cur ? ' checked' : '') + '><span>无(执行完成即结束)</span></label>';
    }
    return html;
  }

  function tplHtml(t) {
    var c = BACK_DATA.byId(BACK_DATA.components, t.componentId);
    var compOff = !!c && c.status === 0;
    var nm = c ? c.name : '(组件已删除)';
    var flds = c ? c.fields.length : 0;
    var req = c ? c.fields.filter(function (f) { return f.req === 'required'; }).length : 0;
    var opt = c ? c.fields.filter(function (f) { return f.req === 'optional'; }).length : 0;
    var aut = c ? c.fields.filter(function (f) { return f.req === 'auto'; }).length : 0;
    var dept = c ? BACK_DATA.dept(c.departmentId) : null;
    /* 待配置 = 没选档位 或 没选执行人(跟踪人允许为空) 或 两个角色相同(D30 阻断) */
    var pending = !t.sched || !t.sched.type || !t.executor || BACK_PROJ.roleConflict(t);
    var cls = 'tmpl' + (t.status === 0 ? ' off' : '') + (pending && t.status === 1 ? ' pending' : '');
    var st = t.sched || { type: '', days: 0 };

    /* 什么时候做 —— 两档互斥(PRD D7 / D17 / D21):
     *   每 N 天 —— 重复档,**以患者入组日 D0 为起点**,D0 起每 N 天一次;N 默认 1(N = 1 显示「每天」)
     *   第 N 天 —— 单次档,N = 0 就是**入组当天**;D0 + N 只生成一条
     * ⛔ 旧的第三档(以出院为基准)已于 2026-11-05 删除。一天多次靠拆组件,不设时间点。
     * ⚠️ 新增条目**不预选**任何一档,标「待配置」;「每 N 天」档内的 N 默认 1,不代表已选档位。 */
    var isEvery = st.type === 'every';
    var isDayn = st.type === 'dayn';
    var everyN = isEvery ? (st.days == null ? 1 : Number(st.days)) : 1;
    var daynN = isDayn ? Number(st.days || 0) : 0;
    var pills =
      '<label class="pill"><input type="radio" name="sch-' + t.id + '" value="every"'
        + (isEvery ? ' checked' : '') + '><span>每</span>'
        + '<input class="ipt dayn" type="number" min="1" max="3650" step="1" data-days-every="' + t.id + '"'
        + ' value="' + everyN + '"'
        + (isEvery ? '' : ' disabled') + '><span>天</span></label>'
      + '<label class="pill"><input type="radio" name="sch-' + t.id + '" value="dayn"'
        + (isDayn ? ' checked' : '') + '><span>第</span>'
        + '<input class="ipt dayn" type="number" min="0" max="3650" step="1" data-days="' + t.id + '"'
        + ' value="' + daynN + '"'
        + (isDayn ? '' : ' disabled') + '><span>天</span></label>';

    return '<div class="' + cls + '" data-tid="' + t.id + '">'
      + '<div class="tmpl-head">'
      +   '<div class="tmpl-ic">' + (c
            ? '<img src="assets/icons-png/' + c.icon + '.png" alt="">'
            : '<span style="font-size:11px;color:var(--ink-3)">?</span>') + '</div>'
      +   '<div class="tmpl-info"><b>' + esc(nm) + '</b>'
      +     '<div class="cell-sub">' + (dept ? esc(dept.name) : '—') + ' · ' + flds + ' 个字段'
      +     (flds ? '(必填 ' + req + ' · 选填 ' + opt + ' · 自动 ' + aut + ')' : '') + '</div></div>'
      +   (compOff ? '<span class="badge badge-gray">组件已停用</span>' : '')
      +   (t.manualReview ? '<span class="badge badge-warn">需人工判读</span>' : '')
      +   (pending && t.status === 1 ? '<span class="badge badge-warn tmpl-pending">待配置</span>' : '')
      +   '<span class="badge badge-info tmpl-sched">' + esc(BACK_PROJ.schedLabel(t.sched)) + '</span>'
      +   '<div class="tmpl-acts">'
      +     '<label class="switch"><input type="checkbox" data-on="' + t.id + '"' + (t.status === 1 ? ' checked' : '') + '>'
      +       '<span class="sw-track"></span><span class="sw-lab tmpl-off-label">' + (t.status === 1 ? '启用' : '停用') + '</span></label>'
      +     '<a class="btn-text" data-up="' + t.id + '">上移</a>'
      +     '<a class="btn-text" data-down="' + t.id + '">下移</a>'
      +     '<a class="btn-text danger" data-del="' + t.id + '">移除</a>'
      +   '</div>'
      + '</div>'
      + '<div class="tmpl-dims">'
      +   '<div class="dim-row"><span class="dim-lab">何时做</span>' + pills + '</div>'
      +   '<div class="dim-row"><span class="dim-lab">执行人</span>' + roleRadios('ex', t.id, t.executor) + '</div>'
      +   '<div class="dim-row"><span class="dim-lab">跟踪人</span>' + roleRadios('tr', t.id, t.tracker) + '</div>'
      + '</div>'
      + '</div>';
  }

  function renderTpls() {
    var box = document.getElementById('tplList');
    document.getElementById('tplCount').textContent = tpls.length + ' 条';
    if (!tpls.length) {
      box.innerHTML = '<div class="empty"><img src="assets/icons-png/icon-empty-box.png" alt="">'
        + '<div class="e-t">本项目还没有项目任务</div>'
        + '<div class="e-d">点右上角「从任务组件库添加」,从本科室挑组件开始配</div></div>';
      return;
    }
    box.innerHTML = tpls.map(tplHtml).join('');
  }

  function tplById(tid) {
    for (var i = 0; i < tpls.length; i++) if (String(tpls[i].id) === String(tid)) return tpls[i];
    return null;
  }

  /* ⚠️ 新条目 id 必须**本页唯一**:
   *   BACK_PROJ.nextId 只扫「已持久化」的 projects,本页连续加两条会拿到同一个 id
   *   ⇒ data-tid 重复 ⇒ document.querySelector('.tmpl[data-tid=…]') 永远命中第一行
   *   ⇒ 第二行的单次档天数框不会被启用(实测:勾了该档,天数框仍是灰的,点不动)。
   *   这里在 nextId 基础上顺延,直到本页不撞号。 */
  function newTplId() {
    var base = String(BACK_PROJ.nextId('pt'));
    var n = parseInt(base.replace(/^[a-z]+_?/, ''), 10);
    if (isNaN(n) || n < 1) n = 1;
    var id;
    do { id = 'pt' + n; n++; } while (tplById(id));
    return id;
  }

  /* ---------- 编排区交互(事件委托) ----------
   * ⚠️ 改维度**不整块重绘**:重绘会把刚点中的 radio 从 DOM 里换掉,
   *    焦点丢失、正在输入的天数被冲掉(实测会打断连续配置)。改为就地同步。 */
  function syncTplCell(tid) {
    var t = tplById(tid);
    if (!t) return;
    var node = document.querySelector('.tmpl[data-tid="' + t.id + '"]');
    if (!node) return;
    var pending = !t.sched || !t.sched.type || !t.executor || BACK_PROJ.roleConflict(t);

    var b = node.querySelector('.tmpl-sched');
    if (b) b.textContent = BACK_PROJ.schedLabel(t.sched);

    var pb = node.querySelector('.tmpl-pending');
    if (pb) pb.style.display = (pending && t.status === 1) ? '' : 'none';
    node.classList.toggle('pending', pending && t.status === 1);

    /* 天数输入框的可用性跟着「何时做」走(两档各一个输入框) */
    node.querySelectorAll('input[data-days], input[data-days-every]').forEach(function (inp) {
      var kind = inp.hasAttribute('data-days-every') ? 'every' : 'dayn';
      inp.disabled = (t.sched.type !== kind);
      /* 「每 N 天」的 N 最小为 1(空 / 0 / 负数一律回落到 1) */
      if (kind === 'every') {
        var n = Number(inp.value || 1);
        if (!Number.isInteger(n) || n < 1) { n = 1; inp.value = 1; }
      }
    });

    var sw = node.querySelector('.tmpl-off-label');
    if (sw) sw.textContent = t.status === 1 ? '启用' : '停用';
    node.classList.toggle('off', t.status === 0);
  }

  document.getElementById('tplList').addEventListener('change', function (e) {
    var el = e.target;
    /* 启用 / 停用开关 */
    if (el.getAttribute('data-on')) {
      var t = tplById(el.getAttribute('data-on'));
      if (t) { t.status = el.checked ? 1 : 0; syncTplCell(t.id); }
      return;
    }
    /* 何时做:单选(每 N 天 / 第 N 天) */
    if (el.type === 'radio' && el.name.indexOf('sch-') === 0) {
      var tid = el.name.replace('sch-', '');
      var t2 = tplById(tid);
      if (!t2) return;
      /* 切换档位时沿用当前 N(便于来回切换不丢);
       * 「每 N 天」的 N 小于 1 时回落到 1(最小 1 天)。 */
      var n2 = Number(t2.sched.days || 0);
      if (el.value === 'every' && (!Number.isInteger(n2) || n2 < 1)) n2 = 1;
      if (el.value === 'dayn' && (!Number.isInteger(n2) || n2 < 0)) n2 = 0;
      t2.sched = { type: el.value, days: n2 };
      syncTplCell(t2.id);
      return;
    }
    /* 执行人:单选(角色位) */
    if (el.type === 'radio' && el.hasAttribute('data-ex')) {
      var t3 = tplById(el.getAttribute('data-ex'));
      if (!t3) return;
      t3.executor = el.value;
      syncTplCell(t3.id);
      if (BACK_PROJ.roleConflict(t3)) Back.toast('执行人与跟踪人不能是同一类角色', 'err');
      return;
    }
    /* 下一步跟踪人:单选(角色位 / 无) */
    if (el.type === 'radio' && el.hasAttribute('data-tr')) {
      var t6 = tplById(el.getAttribute('data-tr'));
      if (!t6) return;
      t6.tracker = el.value;   /* '' = 无跟踪人 */
      syncTplCell(t6.id);
      if (BACK_PROJ.roleConflict(t6)) Back.toast('执行人与跟踪人不能是同一类角色', 'err');
      return;
    }
    /* 「每 N 天」的间隔 N(1–3650;空 / 0 / 负数回落到 1) */
    var dEvery = el.getAttribute('data-days-every');
    if (dEvery) {
      var t5 = tplById(dEvery);
      if (!t5) return;
      var n5 = Number(el.value || 1);
      if (!Number.isInteger(n5) || n5 < 1) n5 = 1;
      t5.sched = { type: 'every', days: n5 };
      syncTplCell(t5.id);
      return;
    }
    /* 「第 N 天」的 N(0–3650;0 = 入组当天) */
    var dDay = el.getAttribute('data-days');
    if (dDay) {
      var t4 = tplById(dDay);
      if (!t4) return;
      var n4 = Number(el.value || 0);
      if (!Number.isInteger(n4) || n4 < 0) n4 = 0;
      t4.sched.days = n4;
      syncTplCell(t4.id);
      return;
    }
  });

  document.getElementById('tplList').addEventListener('click', function (e) {
    var g = function (a) { return e.target.getAttribute && e.target.getAttribute(a); };
    var up = g('data-up'), down = g('data-down'), del = g('data-del');
    if (up || down) {
      var tid = up || down;
      var idx = -1;
      tpls.forEach(function (t, i) { if (String(t.id) === String(tid)) idx = i; });
      var to = idx + (up ? -1 : 1);
      if (idx < 0 || to < 0 || to >= tpls.length) {
        Back.toast(up ? '已经是第一条' : '已经是最后一条', 'warn');
        return;
      }
      var tmp = tpls[idx]; tpls[idx] = tpls[to]; tpls[to] = tmp;
      renderTpls();
      return;
    }
    if (del) {
      var t = tplById(del);
      var c = t ? BACK_DATA.byId(BACK_DATA.components, t.componentId) : null;
      document.getElementById('delBody').innerHTML =
        '确认移除「' + esc(c ? c.name : '') + '」这条项目任务?<br>'
        + '移除后<b>不再为它生成新任务</b>;<b>已生成的任务与填报记录全部保留</b>,随时可以重新添加。';
      document.getElementById('delOk').onclick = function () {
        tpls = tpls.filter(function (x) { return String(x.id) !== String(del); });
        Back.modal('delModal', false); renderTpls();
        Back.toast('已移除项目任务', 'warn');
      };
      Back.modal('delModal', true);
    }
  });

  /* ==========================================================
   * 从任务库添加组件(抽屉 · PC 侧不整页跳转)
   * ========================================================== */
  function renderPick() {
    var did = curDeptId();
    var onlyMine = document.getElementById('onlyMine').checked;
    var kw = document.getElementById('pickKw').value.trim();
    /* 组件按**当前医院**过滤(Back.hospFilter 的 'components' 口径 = 组件所属科室属本院) */
    var rows = Back.hospFilter(BACK_DATA.components, 'components').filter(function (c) {
      if (onlyMine && String(c.departmentId) !== String(did)) return false;
      if (kw && c.name.indexOf(kw) < 0) return false;
      return true;
    });

    var tb = document.getElementById('pickBody');
    tb.innerHTML = rows.length ? rows.map(function (c) {
      var d = BACK_DATA.dept(c.departmentId);
      var cross = String(c.departmentId) !== String(did);
      var used = tpls.filter(function (t) { return t.componentId === c.id; }).length;
      var req = c.fields.filter(function (f) { return f.req === 'required'; }).length;
      var opt = c.fields.filter(function (f) { return f.req === 'optional'; }).length;
      var aut = c.fields.filter(function (f) { return f.req === 'auto'; }).length;
      return '<tr' + (cross ? ' class="row-muted"' : '') + '>'
        + '<td><input type="checkbox" data-pick="' + c.id + '"' + (picked[c.id] ? ' checked' : '') + (cross ? ' disabled' : '') + '></td>'
        + '<td><div class="cell-user"><span class="av-xs" style="background:var(--brand-light)">'
        +   '<img src="assets/icons-png/' + c.icon + '.png" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover"></span>'
        +   '<div><div class="cell-main">' + esc(c.name) + '</div>'
        +   (used ? '<div class="cell-sub">该项目已引用 ' + used + ' 条</div>' : '') + '</div></div></td>'
        + '<td class="fz-12">' + (d ? esc(d.name) : '—') + (cross ? '<div class="cell-sub">跨科室,不可选</div>' : '') + '</td>'
        + '<td class="fz-12">' + c.fields.length + ' 个字段<span class="cell-sub">必填 ' + req + ' · 选填 ' + opt + ' · 自动 ' + aut + '</span></td>'
        + '<td>' + (c.status === 1 ? '<span class="badge badge-pass">启用</span>' : '<span class="badge badge-gray">已停用</span>') + '</td>'
        + '</tr>';
    }).join('')
    : '<tr><td colspan="5"><div class="empty"><img src="assets/icons-png/icon-empty-box.png" alt="">'
      + '<div class="e-t">' + (onlyMine ? '本科室还没有任务组件' : '没有符合条件的组件') + '</div>'
      + '<div class="e-d">' + (onlyMine
          ? '请先到「任务组件库」为本科室配置组件,或关掉「仅本科室组件」查看全院组件'
          : '试试调整搜索词') + '</div></div></td></tr>';

    document.getElementById('pickCount').textContent = '已选 ' + Object.keys(picked).filter(function (k) { return picked[k]; }).length + ' 个';
  }

  document.getElementById('pickBtn').addEventListener('click', function () {
    if (!curDeptId()) {
      Back.toast('请先选择归属科室', 'warn');
      return;
    }
    renderPick();
    Back.drawer('pickDrawer', true);
  });
  document.getElementById('pickKw').addEventListener('input', renderPick);
  document.getElementById('onlyMine').addEventListener('change', renderPick);
  document.getElementById('pickBody').addEventListener('change', function (e) {
    var pid = e.target.getAttribute && e.target.getAttribute('data-pick');
    if (!pid) return;
    picked[pid] = e.target.checked;
    document.getElementById('pickCount').textContent =
      '已选 ' + Object.keys(picked).filter(function (k) { return picked[k]; }).length + ' 个';
  });
  document.getElementById('pickOk').addEventListener('click', function () {
    var ids = Object.keys(picked).filter(function (k) { return picked[k]; });
    if (!ids.length) { Back.toast('还没有勾选组件', 'warn'); return; }
    ids.forEach(function (cid) {
      tpls.push({
        id: newTplId(),
        componentId: Number(cid),
        /* ⚠️ 新条目**不预选档位、不预选执行人**(与 back-drug-edit 的必填项口径一致):
         *   预选「每 1 天 / 患者」会把「第 0 天·完成药物清单」这类配置配错。
         *   跟踪人允许为空(= 执行完成即结束)。 */
        sched: { type: '', days: 0 },
        executor: '',
        tracker: '',
        manualReview: false,
        status: 1
      });
    });
    picked = {};
    renderTpls();
    Back.drawer('pickDrawer', false);
    Back.toast('已添加 ' + ids.length + ' 条项目任务,请配置何时做与执行人', 'ok');
  });

  /* ==========================================================
   * 保存
   * ========================================================== */
  document.getElementById('saveBtn').addEventListener('click', function () {
    var ok = Back.validate(document.body, {
      dept:     { required: true, msg: '请选择归属科室' },
      name:     { required: true, minLen: 2, maxLen: 100, msg: '项目主题 2–100 字' },
      lead:     { required: true, msg: '请选择主负责医生' },
      startDate:{ required: true, msg: '请选择开始日期' },
      endDate:  { required: true, msg: '请选择结束日期' }
    });

    var name = document.querySelector('[name="name"]').value.trim();
    var did = curDeptId();
    /* 同科室重名校验(跨科室同名允许) */
    if (ok && did) {
      var dup = BACK_PROJ.ofHospital((Back.currentHospital() || {}).id).filter(function (p) {
        return String(p.departmentId) === String(did) && p.name === name && (!isEdit || String(p.id) !== String(proj.id));
      })[0];
      if (dup) {
        var fi = document.querySelector('[name="name"]').closest('.fi');
        fi.classList.add('has-err');
        fi.querySelector('.err-msg').textContent = '该科室下已存在同名项目';
        ok = false;
      }
    }

    /* 周期(长期 = 没有固定天数 ⇒ 不校验 1–3650) */
    var longTerm = isLongTerm();
    var dur = durationDays();
    if (!longTerm && (dur < 1 || dur > 3650)) {
      var fi2 = document.querySelector('[name="durPreset"]').closest('.fi');
      fi2.classList.add('has-err');
      fi2.querySelector('.err-msg').textContent = '项目周期不合法,请重新填写';
      ok = false;
    }
    /* 起止日期(长期 ⇒ 没有结束日期,不校验) */
    var sd = document.querySelector('[name="startDate"]').value;
    var ed = longTerm ? '' : document.querySelector('[name="endDate"]').value;
    if (!longTerm && sd && ed && ed < sd) {
      var fi3 = document.querySelector('[name="endDate"]').closest('.fi');
      fi3.classList.add('has-err');
      fi3.querySelector('.err-msg').textContent = '结束日期不得早于开始日期';
      ok = false;
    }
    /* 定价 */
    var price = document.querySelector('[name="price"]').value;
    if (price !== '' && Number(price) < 0) {
      var fi4 = document.querySelector('[name="price"]').closest('.fi');
      fi4.classList.add('has-err');
      fi4.querySelector('.err-msg').textContent = '定价不能为负数';
      ok = false;
    }
    /* 定价上限:基线 project.price 是 DECIMAL(10,2) ⇒ 最大 99999999.99 */
    if (price !== '' && Number(price) > 99999999.99) {
      var fi4b = document.querySelector('[name="price"]').closest('.fi');
      fi4b.classList.add('has-err');
      fi4b.querySelector('.err-msg').textContent = '定价超出可存储上限(最多 99999999.99)';
      ok = false;
    }

    /* 何时做 + 执行人必须配齐(跟踪人允许为空) */
    var bad = null;
    for (var i = 0; i < tpls.length; i++) {
      var t = tpls[i];
      if (!t.sched || !t.sched.type) { bad = { t: t, why: '未选「何时做」' }; break; }
      if (!t.executor) { bad = { t: t, why: '未选执行人' }; break; }
      /* 🔴 D30:执行人与跟踪人不能是同一类角色(performer_role <> tracker_role) */
      if (t.tracker && t.executor === t.tracker) {
        bad = { t: t, why: '执行人与跟踪人不能是同一类角色' }; break;
      }
      /* 天数校验(PRD D7 / D17 / D21):
       *   「每 N 天」—— N 是 1–3650 的整数,且有限项目下 N ≤ 项目周期
       *   「第 N 天」—— N 是 0–3650 的整数,且有限项目下 N ≤ 项目周期
       * ⚠️ 长期项目**没有周期上限** ⇒ 只受静态上限 3650 约束 */
      if (t.sched.type === 'every') {
        var ne = Number(t.sched.days);
        if (!Number.isInteger(ne) || ne < 1 || ne > 3650) {
          bad = { t: t, why: '「每 N 天」需填写正整数' }; break;
        }
        if (!longTerm && dur && ne > dur) {
          bad = { t: t, why: '每 ' + ne + ' 天超出项目周期(' + dur + ' 天)' }; break;
        }
      } else if (t.sched.type === 'dayn') {
        var n = Number(t.sched.days);
        var lbl = '第 ' + n + ' 天';
        if (!Number.isInteger(n) || n < 0) { bad = { t: t, why: '天数必须是非负整数' }; break; }
        if (!longTerm && dur && n > dur) {
          bad = { t: t, why: lbl + '超出项目周期(' + dur + ' 天)' }; break;
        }
        if (n > 3650) { bad = { t: t, why: lbl + '超出上限' }; break; }
      }
    }
    if (bad) {
      var node = document.querySelector('.tmpl[data-tid="' + bad.t.id + '"]');
      if (node) { node.scrollIntoView({ block: 'center' }); node.style.borderColor = 'var(--block)'; }
      Back.toast('项目任务「' + bad.why + '」,请补齐后再保存', 'err');
      ok = false;
    }

    if (!ok) return;

    /* ---- 落库 ---- */
    /* ⚠️ 2026-11-05:两端都能改 ⇒ 末次写入生效 + 每次写入都留审计。
     *   审计**记录**照写(存储口径归 AR 定),但**不做展示** ——
     *   用户拍板去掉「最后修改」区块(后台该区块没有实际用处)。 */
    /* ⚠️ `longTerm` + `durationDays: 0` **只是 mock 写法**,不是存储口径 ——
     *   「长期」在 DB / API 怎么存由 AR 定;页面一律按 `longTerm` 标记判定。 */
    var payload = {
      name: name,
      tag: document.querySelector('[name="tag"]').value,
      durationDays: longTerm ? 0 : dur,
      longTerm: longTerm,
      startDate: sd,
      endDate: longTerm ? '' : ed,
      price: price === '' ? 0 : Number(price),
      leadDoctorId: Number(document.querySelector('[name="lead"]').value)
    };
    if (isEdit) {
      BACK_PROJ.updateProject(proj.id, payload);
      /* 项目任务整表替换(顺序重排) */
      tpls.forEach(function (t, i) { t.order = i + 1; });
      proj.tasks = tpls;
      BACK_PROJ.save();
      Back.toast('已保存项目', 'ok');
      setTimeout(function () { location.href = 'back-projects.html'; }, 700);
    } else {
      var np = {
        id: 'p_' + Date.now(),
        hospitalId: (Back.currentHospital() || {}).id,
        departmentId: Number(did),
        name: name, tag: payload.tag,
        durationDays: payload.durationDays, longTerm: payload.longTerm,
        price: payload.price, startDate: sd, endDate: payload.endDate,
        leadDoctorId: payload.leadDoctorId,
        status: 1,
        icon: 'assets/icons-png/icon-tab-projects.png',
        summary: '',
        tasks: tpls.map(function (t, i) { t.order = i + 1; return t; })
      };
      BACK_PROJ.addProject(np);
      Back.toast('已新建项目:' + name, 'ok');
      setTimeout(function () { location.href = 'back-projects.html'; }, 700);
    }
  });

  if (!Back.requireHospitalAndApply()) { document.querySelector('.back-main').innerHTML = ''; }
  else { document.getElementById('scopeStrip').innerHTML = Back.scopeStrip('项目按科室创建:本科室的项目由本科室配项目任务'); }
  renderTpls();
  if (location.hash === '#templates') {
    setTimeout(function () {
      var el = document.getElementById('templates');
      if (el) el.scrollIntoView({ block: 'start' });
    }, 120);
  }
</script>
</body>
</html>
