<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目详情 · 后台管理</title>
  <link rel="stylesheet" href="assets/back.css">
  <style>
    .ro { padding: 8px 11px; border: 1px solid var(--line); border-radius: var(--r-base);
          background: var(--bg-3); font-size: 13px; color: var(--ink); min-height: 36px; }
    .grp-t { font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 14px 0 8px;
             display: flex; align-items: center; gap: 8px; }
    .grp-t:first-child { margin-top: 0; }
    .grp-t .n { font-weight: 400; color: var(--ink-3); }
    .tgt { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
    .tgt .chip { cursor: default; }
    .role-row { display: flex; gap: 10px; padding: 10px 0; border-top: 1px dashed var(--line); }
    .role-row:first-child { border-top: 0; }
    .role-bit { width: 26px; height: 26px; border-radius: var(--r-md); background: var(--brand-light);
                color: var(--brand-dark); font-size: 11px; font-weight: 600; display: grid; place-items: center; flex: none; }
  </style>
</head>
<body data-page="projects" data-crumb='[{"name":"后台管理"},{"name":"任务"},{"href":"back-projects.html","name":"项目管理"},{"name":"项目详情"}]'>

<main class="back-main">

  <div class="page-head">
    <h1 id="ttl">项目详情</h1>
    <div class="sub" id="sub"></div>
  </div>

  <div id="scopeStrip"></div>

  <div class="flex" style="margin-bottom:14px;">
    <a class="btn btn-default" href="back-projects.html">返回列表</a>
    <span class="ml-auto"></span>
    <a class="btn btn-primary" id="editBtn" href="back-project-edit.html">编辑项目</a>
  </div>

  <div id="offTip"></div>

  <div class="split">
    <div class="grow">

      <!-- ============ 基本信息 ============ -->
      <div class="card">
        <div class="card-head"><h3>基本信息</h3></div>
        <div class="form-grid">
          <div class="fi"><label>归属科室</label><div class="ro" id="fDept">—</div></div>
          <div class="fi"><label>项目主题</label><div class="ro" id="fName">—</div></div>
          <div class="fi"><label>项目类型</label><div class="ro" id="fTag">—</div></div>
          <div class="fi"><label>主负责医生</label><div class="ro" id="fLead">—</div></div>
          <div class="fi"><label>项目周期</label><div class="ro" id="fDur">—</div></div>
          <div class="fi"><label>起止日期</label><div class="ro" id="fDate">—</div></div>
          <div class="fi"><label>定价</label><div class="ro" id="fPrice">—</div></div>
          <div class="fi"><label>状态</label><div class="ro" id="fStatus">—</div></div>
        </div>
      </div>

      <!-- ============ 项目任务 ============ -->
      <div class="card" style="margin-top:16px;">
        <div class="card-head"><h3>项目任务</h3><span class="ch-desc" id="tplCount">0 条</span></div>
        <div class="note note-info">
          <img src="assets/icons-png/icon-info.png">
          <div>患者入组后按此配置<b>自动生成</b>任务;自上而下即患者端顺序。</div>
        </div>
        <div id="tplBody"></div>
      </div>

      <!-- ============ 已入组患者(可结管,不可新增) ============ -->
      <div class="card" style="margin-top:16px;">
        <div class="card-head"><h3>已入组患者</h3><span class="ch-desc" id="enrollCount">0 人</span></div>
        <div class="note note-info">
          <img src="assets/icons-png/icon-info.png">
          <div>入组由患者在小程序自助完成;后台不可新增入组。</div>
        </div>
        <div id="enrollBody"></div>
      </div>
    </div>

    <!-- ============ 右栏 ============ -->
    <div style="width:300px; flex:none;">
      <div class="card">
        <div class="card-head"><h3>执行人 → 跟踪人</h3></div>
        <div id="roleBody"></div>
      </div>
    </div>
  </div>
</main>

<!-- ========== 结管确认 弹窗 ========== -->
<div class="modal-mask" id="closeModal">
  <div class="modal">
    <div class="modal-head">
      <img src="assets/icons-png/icon-warning.png" alt="">
      <h3>结管确认</h3>
    </div>
    <div class="modal-body">
      <div id="closeWho" style="margin-bottom:10px;color:var(--ink)">—</div>
      <div>结管后:</div>
      <ul>
        <li>停止为该患者生成后续任务</li>
        <li>已生成未完成的任务全部取消</li>
        <li>历史任务与填报记录全部保留</li>
      </ul>
      <div class="fi mt-12">
        <label><span class="req">*</span>结管原因</label>
        <select class="sel w-full" id="closeReason">
          <option value="">请选择结管原因…</option>
          <option value="疗程完成">疗程完成</option>
          <option value="患者退出">患者退出</option>
          <option value="转院 / 转诊">转院 / 转诊</option>
          <option value="失访">失访</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="fi mt-12">
        <label>备注</label>
        <textarea class="ipt w-full" id="closeNote" rows="2" maxlength="100" placeholder="选填,≤100 字"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-default" onclick="Back.modal('closeModal',false)">取消</button>
      <button class="btn btn-danger" id="closeOk">确认结管</button>
    </div>
  </div>
</div>

<script src="assets/back-api.js"></script>
<script src="assets/back-data.js"></script>
<script src="assets/projects.js"></script>
<script src="assets/back-project-data.js"></script>
<script src="assets/back-layout.js"></script>
<script>
  var id = Back.qs('id');
  var proj = BACK_PROJ.byId(id);

  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  if (!proj) {
    document.querySelector('.back-main').innerHTML =
      '<div class="page-head"><h1>项目不存在</h1></div>'
      + '<div class="card"><div class="empty"><img src="assets/icons-png/icon-empty-box.png" alt="">'
      + '<div class="e-t">找不到这个项目</div>'
      + '<div class="e-d">它可能已被停用并从当前医院的可见范围里移除。<a href="back-projects.html" style="color:var(--brand)">返回项目列表</a></div>'
      + '</div></div>';
  } else {
    render();
  }

  function render() {
    var d = BACK_DATA.dept(proj.departmentId);
    var doc = proj.leadDoctorId ? BACK_DATA.member(proj.leadDoctorId) : null;

    document.title = proj.name + ' · 项目详情 · 后台管理';
    document.getElementById('ttl').textContent = proj.name;
    document.getElementById('sub').innerHTML =
      '归属科室 <b>' + esc(d ? d.name : '—') + '</b> · 周期 <b>'
      + (proj.longTerm ? '长期' : proj.durationDays + ' 天') + '</b> · '
      + (proj.startDate || '—') + ' ~ '
      + (proj.longTerm ? '长期(只能手动结束)' : (proj.endDate || '—'));
    document.getElementById('editBtn').href = 'back-project-edit.html?id=' + proj.id;

    document.getElementById('fDept').textContent = d ? d.name : '—';
    document.getElementById('fName').textContent = proj.name;
    document.getElementById('fTag').textContent = proj.tag || '管理';
    document.getElementById('fLead').textContent = doc ? doc.name : '—';
    document.getElementById('fDur').textContent = proj.longTerm ? '长期(无结束时间,只能手动结束)' : proj.durationDays + ' 天';
    document.getElementById('fDate').textContent = (proj.startDate || '—') + ' ~ '
      + (proj.longTerm ? '长期(只能手动结束)' : (proj.endDate || '—'));
    document.getElementById('fPrice').textContent = proj.price ? proj.price + ' 元' : '未定价';
    document.getElementById('fStatus').innerHTML = Back.onOff(proj.status);

    if (proj.status === 0) {
      document.getElementById('offTip').innerHTML =
        '<div class="note note-warn"><img src="assets/icons-png/icon-warning.png">'
        + '<div><b>该项目已停用</b>:不再生成新任务,<b>已生成未完成的任务已全部取消</b>;'
        + '项目任务配置全部保留,重新启用后原样恢复;历史数据全部保留。'
        + '<a href="back-projects.html?tab=off" style="color:var(--brand);margin-left:6px">查看已停用项目</a></div></div>';
    }

    renderTpls();
    renderRoles();
    renderEnrollments();
  }

  /* ---------- 项目任务(按「何时做」分组的时间轴)---------- */
  function renderTpls() {
    var tasks = BACK_PROJ.tasksOf(proj.id);
    document.getElementById('tplCount').textContent = tasks.length + ' 条';
    var box = document.getElementById('tplBody');

    if (!tasks.length) {
      box.innerHTML = '<div class="empty"><img src="assets/icons-png/icon-empty-box.png" alt="">'
        + '<div class="e-t">该项目还没有项目任务</div>'
        + '<div class="e-d">到「编辑项目 → 从任务组件库添加」里挑组件开始配</div></div>';
      return;
    }

    /* 分组顺序:每 N 天(按 N 升序) → 第 N 天(按 N 升序)
     * ⚠️ 2026-11-05 执行层重新设计:旧的第三档(以出院为基准)已删除;
     *    「每 N 天」N = 1 的条目仍显示「每天」。 */
    var groups = [
      { key: 'every', title: '每 N 天(重复)', items: [] },
      { key: 'dayn',  title: '第 N 天(单次)',  items: [] }
    ];
    tasks.forEach(function (t) {
      var k = t.sched && t.sched.type;
      var g = groups.filter(function (x) { return x.key === k; })[0];
      if (g) g.items.push(t);
    });
    groups.forEach(function (g) {
      g.items.sort(function (a, b) { return Number(a.sched.days || 0) - Number(b.sched.days || 0); });
    });

    var html = '';
    groups.forEach(function (g) {
      if (!g.items.length) return;
      html += '<div class="grp-t">' + g.title + '<span class="n">' + g.items.length + ' 条</span></div>';
      html += '<div class="timeline">';
      g.items.forEach(function (t, i) {
        var c = BACK_DATA.byId(BACK_DATA.components, t.componentId);
        var compOff = !!c && c.status === 0;
        html += '<div class="tl-item' + (i === 0 ? ' hi' : '') + '">'
          + '<div class="tl-t">' + esc(BACK_PROJ.schedLabel(t.sched)) + '</div>'
          + '<div class="tl-b"><b>' + esc(c ? c.name : '(组件已删除)') + '</b>'
          + (compOff ? ' <span class="badge badge-gray">组件已停用</span>' : '')
          + (t.manualReview ? ' <span class="badge badge-warn">需人工判读</span>' : '')
          + (t.status === 0 ? ' <span class="badge badge-gray">该条已停用</span>' : '')
          + (c ? '<span class="cell-sub">' + c.fields.length + ' 个字段</span>' : '')
          + '</div>'
          + '<div class="tgt">' + '<span class="chip">' + esc(BACK_PROJ.pairLabel(t)) + '</span>' + '</div>'
          + '</div>';
      });
      html += '</div>';
    });
    box.innerHTML = html;
  }

  /* ---------- 已入组患者 ----------
   * 🔴 入组唯一来源 = 患者小程序自助;后台**不提供**代加人入口(2026-11-05 用户拍板)。
   * 🟡 2026-11-05 用户拍板:后台可对已入组患者**结管 / 停止参与**,但仍不能新增入组。
   *    原型只改内存(BACK_DATA.patients),不做持久化。 */
  function renderEnrollments() {
    var rows = (BACK_DATA.patients || []).filter(function (p) {
      return (p.projs || []).some(function (r) { return String(r.projId) === String(proj.id); });
    });
    document.getElementById('enrollCount').textContent = rows.length + ' 人';
    var box = document.getElementById('enrollBody');
    if (!rows.length) {
      box.innerHTML = '<div class="empty" style="padding:26px 10px;">'
        + '<img src="assets/icons-png/icon-empty-box.png" alt="">'
        + '<div class="e-t">还没有患者入组</div>'
        + '<div class="e-d">等待患者在小程序里自行加入本项目 —— 后台不能代加。</div></div>';
      return;
    }
    var html = '<div class="table-wrap"><table class="tbl"><thead><tr>'
      + '<th>患者</th><th>入组日(D0)</th><th>主管医生</th><th>主责护士</th><th>状态</th>'
      + '<th class="col-act" style="width:90px">操作</th>'
      + '</tr></thead><tbody>';
    rows.forEach(function (p) {
      var rec = (p.projs || []).filter(function (r) { return String(r.projId) === String(proj.id); })[0];
      var doc = rec && rec.docId ? BACK_DATA.member(rec.docId) : null;
      var nur = rec && rec.nurId ? BACK_DATA.member(rec.nurId) : null;
      var closed = rec && rec.status === 'closed';
      html += '<tr>'
        + '<td><b>' + esc(p.name || p.nickName || '—') + '</b>'
        +   '<span class="cell-sub">住院号 ' + esc(p.inNo || '—') + '</span></td>'
        + '<td>' + esc(rec && rec.enrole ? rec.enrole : '—') + '</td>'
        + '<td>' + esc(doc ? doc.name : '待分配') + '</td>'
        + '<td>' + esc(nur ? nur.name : '待分配') + '</td>'
        + '<td>' + (closed
            ? '<span class="badge badge-gray">已结管</span>'
              + (rec.closeReason ? '<span class="cell-sub">' + esc(rec.closeReason) + '</span>' : '')
            : '<span class="badge badge-ok">在管</span>') + '</td>'
        + '<td class="col-act">' + (closed
            ? '<span class="text-4">—</span>'
            : '<a class="btn-text" data-close="' + p.id + '">结管</a>') + '</td>'
        + '</tr>';
    });
    html += '</tbody></table></div>';
    box.innerHTML = html;
  }

  /* ---------- 执行人 → 跟踪人 使用统计 ---------- */
  function renderRoles() {
    var ex = BACK_PROJ.roleUsage(proj.id, 'executor');
    var tr = BACK_PROJ.roleUsage(proj.id, 'tracker');
    var total = BACK_PROJ.tasksOf(proj.id).length;
    var html = BACK_PROJ.ROLES.map(function (r) {
      return '<div class="role-row">'
        + '<div class="role-bit">' + esc(r.label.slice(0, 1)) + '</div>'
        + '<div><div style="font-size:13px;font-weight:500">' + esc(r.label) + '</div>'
        + '<div class="cell-sub">执行 ' + (ex[r.key] || 0) + ' 条 · 跟踪 ' + (tr[r.key] || 0) + ' 条</div></div>'
        + '</div>';
    }).join('');
    var noTracker = total - (tr.doctor || 0) - (tr.nurse || 0) - (tr.patient || 0);
    html += '<div class="role-row"><div class="role-bit">—</div><div>'
      + '<div style="font-size:13px;font-weight:500">无跟踪人</div>'
      + '<div class="cell-sub">' + noTracker + ' 条(执行人完成即结束)</div></div></div>';
    html += '<div class="note note-gray" style="margin-top:10px"><img src="assets/icons-png/icon-info.png">'
      + '<div>角色位,入组时解析为具体人。</div></div>';
    document.getElementById('roleBody').innerHTML = html;
  }

  /* ---------- 结管(2026-11-05 用户拍板) ----------
   * 后台可对已入组患者结管 / 停止参与;⛔ 仍不提供新增入组入口。
   * 原型只改内存,不落库。 */
  var closingPid = null;

  function fmtToday() {
    var d = new Date();
    var m = String(d.getMonth() + 1); if (m.length < 2) m = '0' + m;
    var day = String(d.getDate()); if (day.length < 2) day = '0' + day;
    return d.getFullYear() + '-' + m + '-' + day;
  }
  function patientById(pid) {
    var list = BACK_DATA.patients || [];
    for (var i = 0; i < list.length; i++) {
      if (String(list[i].id) === String(pid)) return list[i];
    }
    return null;
  }

  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('[data-close]') : null;
    if (!a) return;
    var p = patientById(a.getAttribute('data-close'));
    if (!p) return;
    closingPid = p.id;
    document.getElementById('closeWho').innerHTML =
      '患者 <b>' + esc(p.name || p.nickName || '—') + '</b> · 项目「' + esc(proj.name) + '」';
    document.getElementById('closeReason').value = '';
    document.getElementById('closeNote').value = '';
    Back.modal('closeModal', true);
  });

  document.getElementById('closeOk').addEventListener('click', function () {
    var reason = document.getElementById('closeReason').value;
    if (!reason) { Back.toast('请选择结管原因', 'warn'); return; }
    var p = patientById(closingPid);
    if (!p) { Back.modal('closeModal', false); return; }
    var rec = (p.projs || []).filter(function (r) { return String(r.projId) === String(proj.id); })[0];
    if (!rec || rec.status === 'closed') { Back.modal('closeModal', false); return; }
    var note = document.getElementById('closeNote').value.trim();
    rec.status = 'closed';
    rec.closedAt = fmtToday();
    rec.closeReason = note ? (reason + ' · ' + note) : reason;
    /* 该患者已无在管项目 ⇒ 患者级状态同步为已结管(与「病患」模块口径一致) */
    if ((p.projs || []).every(function (r) { return r.status === 'closed'; })) {
      p.status = 'closed';
    }
    Back.modal('closeModal', false);
    renderEnrollments();
    Back.toast('已结管:' + (p.name || p.nickName || ''), 'ok');
  });

  if (!Back.requireHospitalAndApply()) { document.querySelector('.back-main').innerHTML = ''; }
  else {
    var ss = document.getElementById('scopeStrip');
    /* ⚠️ 项目不存在时上面的分支已把 .back-main 整块换掉,scopeStrip 已不在 DOM 里 */
    if (ss) ss.innerHTML = Back.scopeStrip('项目按本院过滤,再按归属科室筛选');
  }
</script>
</body>
</html>
