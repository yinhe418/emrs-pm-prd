<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务详情</title>
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .feed-record-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .feed-record-card .head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--line);
    }
    .feed-record-card .head .type-badge {
      padding: 3px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
      color: white;
      flex-shrink: 0;
    }
    .type-badge.bp     { background: #2E7D57; }
    .type-badge.followup { background: #1976D2; }
    .type-badge.upload   { background: #F57C00; }
    .type-badge.med      { background: #6A1B9A; }

    .feed-record-card .head .ts {
      font-size: 13px;
      color: var(--ink-2);
      font-weight: 500;
    }
    .feed-record-card .head .actor {
      font-size: 12px;
      color: var(--ink-3);
      margin-left: auto;
    }

    .data-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 16px;
      font-size: 13px;
      color: var(--ink-2);
    }
    .data-grid .k {
      font-size: 11px;
      color: var(--ink-3);
      margin-bottom: 2px;
    }
    .data-grid .v {
      font-size: 16px;
      font-weight: 600;
      color: var(--ink);
    }
    .data-grid .v.abnormal { color: var(--block); }

    .script-list {
      background: var(--bg);
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      color: var(--ink-2);
      line-height: 1.9;
    }
    .script-list .q { color: var(--ink); }
    .script-list .a {
      color: var(--pass);
      margin-left: 8px;
    }

    .feed-thumb {
      display: block;
      width: 100%;
      max-width: 280px;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: zoom-in;
    }

    .related-link {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px;
      background: var(--brand-light);
      border: 1px solid rgba(46, 125, 215, 0.2);
      border-radius: 10px;
      font-size: 13px;
      color: var(--brand);
      text-decoration: none;
      margin-top: 12px;
    }
    .related-link:hover { background: white; }
  </style>
</head>
<body>
  <div class="app">
    <div class="navbar">
      <button class="back" onclick="goBack()"><span style="font-size:22px; font-weight:700; line-height:1;">‹</span></button>
      <div class="title" id="pageTitle">记录详情</div>
      <div class="actions"></div>
    </div>

    <div class="page" id="content">
      <!-- JS 渲染 -->
    </div>
  </div>
  <script src="assets/layout.js"></script>
  <script>
    function getParam(name) {
      var qs = location.search.replace(/^\?/, '');
      if (!qs) return null;
      var pairs = qs.split('&');
      for (var i = 0; i < pairs.length; i++) {
        var kv = pairs[i].split('=');
        if (kv[0] === name && kv[1]) return decodeURIComponent(kv[1]);
      }
      return null;
    }

    function goBack() {
      // 优先看 URL 上的 from 参数(更稳定,不受 referrer 限制)
      var from = getParam('from');
      if (from === 'nurse') {
        // 尝试回上一页(若是 nurse-home),否则直接跳
        if (document.referrer && document.referrer.indexOf('nurse-home') !== -1) {
          history.back();
        } else {
          location.href = 'nurse-home.html';
        }
        return;
      }
      // 默认医生端
      if (document.referrer && document.referrer.indexOf('doctor-patient-detail') !== -1) {
        history.back();
      } else {
        location.href = 'doctor-patient-detail.html';
      }
    }

    var TYPE = getParam('type') || 'bp';
    var TS   = getParam('id')   || '';

    // ─────────────────────────────────────────────
    // 4 类记录的数据 + 渲染
    // ─────────────────────────────────────────────
    var DATA = {
      bp: {
        title: '血压记录详情',
        badge: '血压',
        badgeClass: 'bp',
        time: '2025-12-27 08:30',
        actor: '陈丙英(患者)',
        html: ''
      },
      followup: {
        title: '电话回访详情',
        badge: '随访',
        badgeClass: 'followup',
        time: '2025-12-26 16:00',
        actor: '护士甲',
        html: ''
      },
      upload: {
        title: '报告上传详情',
        badge: '报告',
        badgeClass: 'upload',
        time: '2025-12-25 10:15',
        actor: '陈丙英(患者)',
        html: ''
      },
      med: {
        title: '服药反馈详情',
        badge: '服药',
        badgeClass: 'med',
        time: '2025-12-24 09:00',
        actor: '陈丙英(患者)',
        html: ''
      }
    };

    // BP 详情
    DATA.bp.html =
      '<div class="feed-record-card">' +
        '<div class="head">' +
          '<span class="type-badge bp">血压</span>' +
          '<span class="ts">' + DATA.bp.time + '</span>' +
          '<span class="actor">' + DATA.bp.actor + '</span>' +
        '</div>' +
        '<div class="data-grid">' +
          '<div><div class="k">收缩压(高压)</div><div class="v abnormal">135 <span style="font-size:12px;font-weight:400;color:var(--ink-3);">mmHg</span></div></div>' +
          '<div><div class="k">舒张压(低压)</div><div class="v">82 <span style="font-size:12px;font-weight:400;color:var(--ink-3);">mmHg</span></div></div>' +
          '<div><div class="k">心率</div><div class="v">76 <span style="font-size:12px;font-weight:400;color:var(--ink-3);">bpm</span></div></div>' +
          '<div><div class="k">测量体位</div><div class="v" style="font-size:14px;">坐位</div></div>' +
        '</div>' +
        '<div style="margin-top:14px; padding-top:12px; border-top:1px dashed var(--line);">' +
          '<div class="k" style="font-size:11px;color:var(--ink-3);margin-bottom:4px;">备注</div>' +
          '<div style="font-size:13px;color:var(--ink-2);line-height:1.6;">早上服药前测量,稍偏高。已通知护士甲。</div>' +
        '</div>' +
        '<div style="margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); font-size:12px; color:var(--ink-3);">' +
          '📈 对比上次(2025-12-26 21:30)132/80 mmHg → <b style="color:var(--ink-2);">135/82</b> 偏高' +
        '</div>' +
      '</div>' +
      '<a href="patient-task-bp.html" class="related-link">📝 录入新血压记录 →</a>';

    // 7天随访详情
    DATA.followup.html =
      '<div class="feed-record-card">' +
        '<div class="head">' +
          '<span class="type-badge followup">随访</span>' +
          '<span class="ts">' + DATA.followup.time + '</span>' +
          '<span class="actor">' + DATA.followup.actor + '</span>' +
        '</div>' +
        '<div class="data-grid">' +
          '<div><div class="k">随访方式</div><div class="v" style="font-size:14px;">电话</div></div>' +
          '<div><div class="k">通话时长</div><div class="v" style="font-size:14px;">约 20 分钟</div></div>' +
          '<div><div class="k">随访结果</div><div class="v" style="font-size:14px;color:var(--pass);">已完成</div></div>' +
          '<div><div class="k">下次随访</div><div class="v" style="font-size:14px;">D30</div></div>' +
        '</div>' +
        '<div style="margin-top:14px;">' +
          '<div class="k" style="font-size:11px;color:var(--ink-3);margin-bottom:8px;">话术执行情况</div>' +
          '<div class="script-list">' +
            '<div><span class="q">今天血压怎么样?</span><span class="a">✓ 135/82,偏高一点</span></div>' +
            '<div><span class="q">阿托伐他汀有没有按时吃?</span><span class="a">✓ 按医嘱</span></div>' +
            '<div><span class="q">有没有不舒服(头痛/麻木/胸闷)?</span><span class="a">✓ 没有</span></div>' +
            '<div><span class="q">康复训练做了吗?</span><span class="a">✓ 每天散步 30 分钟</span></div>' +
            '<div><span class="q">上次复查报告上传了吗?</span><span class="a">✓ 已上传 LDL-C 1.95</span></div>' +
          '</div>' +
        '</div>' +
        '<div style="margin-top:14px; padding-top:12px; border-top:1px dashed var(--line);">' +
          '<div class="k" style="font-size:11px;color:var(--ink-3);margin-bottom:4px;">护士备注</div>' +
          '<div style="font-size:13px;color:var(--ink-2);line-height:1.6;">患者情绪稳定,对治疗有信心。已告知血压偏高但不需调整用药,继续观察 3 天。</div>' +
        '</div>' +
      '</div>';

    // 报告上传详情
    DATA.upload.html =
      '<div class="feed-record-card">' +
        '<div class="head">' +
          '<span class="type-badge upload">报告</span>' +
          '<span class="ts">' + DATA.upload.time + '</span>' +
          '<span class="actor">' + DATA.upload.actor + '</span>' +
        '</div>' +
        '<div class="data-grid">' +
          '<div><div class="k">报告类型</div><div class="v" style="font-size:14px;">血脂全套</div></div>' +
          '<div><div class="k">检查机构</div><div class="v" style="font-size:14px;">H 市第一医院</div></div>' +
          '<div><div class="k">检查日期</div><div class="v" style="font-size:14px;">2025-12-29</div></div>' +
          '<div><div class="k">上传方式</div><div class="v" style="font-size:14px;">拍照</div></div>' +
        '</div>' +
        '<div style="margin-top:14px; padding-top:12px; border-top:1px dashed var(--line);">' +
          '<div class="k" style="font-size:11px;color:var(--ink-3);margin-bottom:8px;">关键指标</div>' +
          '<div class="data-grid">' +
            '<div><div class="k">LDL-C</div><div class="v abnormal">1.95 <span style="font-size:12px;font-weight:400;color:var(--ink-3);">↑</span></div></div>' +
            '<div><div class="k">HDL-C</div><div class="v">1.20</div></div>' +
            '<div><div class="k">TC</div><div class="v">4.85</div></div>' +
            '<div><div class="k">TG</div><div class="v">1.45</div></div>' +
          '</div>' +
        '</div>' +
        '<div style="margin-top:14px;">' +
          '<div class="k" style="font-size:11px;color:var(--ink-3);margin-bottom:6px;">报告缩略图</div>' +
          '<img id="reportThumb" class="feed-thumb" src="" alt="报告缩略图" onclick="enlargeReport()" />' +
          '<div style="text-align:center; font-size:11px; color:var(--ink-3); margin-top:4px;">点图片放大查看</div>' +
        '</div>' +
      '</div>' +
      '<a href="doctor-task-detail.html" class="related-link">⚕ 主管医生判断页(LDL-C 异常)→</a>';

    // 服药反馈详情
    DATA.med.html =
      '<div class="feed-record-card">' +
        '<div class="head">' +
          '<span class="type-badge med">服药</span>' +
          '<span class="ts">' + DATA.med.time + '</span>' +
          '<span class="actor">' + DATA.med.actor + '</span>' +
        '</div>' +
        '<div class="data-grid">' +
          '<div><div class="k">药品</div><div class="v" style="font-size:14px;">阿托伐他汀 20mg</div></div>' +
          '<div><div class="k">医嘱</div><div class="v" style="font-size:14px;">每晚 1 次</div></div>' +
          '<div><div class="k">服用情况</div><div class="v abnormal" style="font-size:14px;">漏服 1 次</div></div>' +
          '<div><div class="k">提交方式</div><div class="v" style="font-size:14px;">文字</div></div>' +
        '</div>' +
        '<div style="margin-top:14px; padding-top:12px; border-top:1px dashed var(--line);">' +
          '<div class="k" style="font-size:11px;color:var(--ink-3);margin-bottom:4px;">患者备注</div>' +
          '<div style="font-size:13px;color:var(--ink-2);line-height:1.6;">' +
            '昨晚睡前忘了吃,今早起来有点头晕恶心,不确定是不是漏服的原因。' +
          '</div>' +
        '</div>' +
        '<div style="margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); font-size:12px; color:var(--ink-3);">' +
          '<b>处理:</b>护士甲已转交主管医生 → 由医生判断后续处理(C6 不会直接判定不依从)' +
        '</div>' +
      '</div>' +
      '<a href="patient-task-med.html" class="related-link">💊 录入新服药反馈 →</a>';

    // ─────────────────────────────────────────────
    // 报告 SVG(给 upload 类型用,复用 doctor-task-detail 的逻辑)
    // ─────────────────────────────────────────────
    function buildReportSVG() {
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="900" viewBox="0 0 640 900" style="background:#fff; font-family:SimSun,serif;">'
        + '<rect x="20" y="20" width="600" height="860" fill="white" stroke="#333" stroke-width="2"/>'
        + '<rect x="20" y="20" width="600" height="60" fill="#C62828"/>'
        + '<text x="320" y="58" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="SimHei">H 市第一医院 · 检验报告单</text>'
        + '<text x="320" y="100" text-anchor="middle" fill="#333" font-size="14">Laboratory Test Report</text>'
        + '<line x1="40" y1="120" x2="600" y2="120" stroke="#666"/>'
        + '<text x="50" y="145" font-size="13">姓名:<tspan font-weight="bold">陈丙英</tspan>  性别:女  年龄:81 岁  科室:神经内科</text>'
        + '<text x="50" y="170" font-size="13">住院号:2025-N-12-3  床号:12-3  申请医生:医生甲</text>'
        + '<text x="50" y="195" font-size="13">标本类型:血清  采集时间:2025-12-29 08:15  报告时间:2025-12-29 10:30</text>'
        + '<line x1="40" y1="215" x2="600" y2="215" stroke="#666"/>'
        + '<text x="50" y="245" font-size="15" font-weight="bold" fill="#1565C0">血脂全套检验结果</text>'
        + '<rect x="50" y="260" width="540" height="200" fill="#F5F5F5" stroke="#999"/>'
        + '<line x1="290" y1="260" x2="290" y2="460" stroke="#999"/>'
        + '<line x1="430" y1="260" x2="430" y2="460" stroke="#999"/>'
        + '<text x="60" y="285" font-size="13" font-weight="bold">项目</text>'
        + '<text x="300" y="285" font-size="13" font-weight="bold">结果</text>'
        + '<text x="440" y="285" font-size="13" font-weight="bold">参考范围</text>'
        + '<rect x="50" y="295" width="540" height="35" fill="#FFEBEE"/>'
        + '<text x="60" y="318" font-size="13">LDL-C(低密度脂蛋白)</text>'
        + '<text x="300" y="318" font-size="15" font-weight="bold" fill="#C62828">1.95 ↑</text>'
        + '<text x="440" y="318" font-size="12" fill="#666">&lt; 2.60(目标 &lt; 1.8)</text>'
        + '<text x="60" y="358" font-size="13">HDL-C(高密度脂蛋白)</text>'
        + '<text x="300" y="358" font-size="14">1.20</text>'
        + '<text x="440" y="358" font-size="12" fill="#666">1.04 - 1.55</text>'
        + '<line x1="50" y1="370" x2="590" y2="370" stroke="#DDD"/>'
        + '<rect x="50" y="375" width="540" height="35" fill="#FFF8E1"/>'
        + '<text x="60" y="398" font-size="13">TC(总胆固醇)</text>'
        + '<text x="300" y="398" font-size="15" font-weight="bold" fill="#F57C00">4.85</text>'
        + '<text x="440" y="398" font-size="12" fill="#666">&lt; 5.20</text>'
        + '<text x="60" y="438" font-size="13">TG(甘油三酯)</text>'
        + '<text x="300" y="438" font-size="14">1.45</text>'
        + '<text x="440" y="438" font-size="12" fill="#666">&lt; 1.70</text>'
        + '<line x1="40" y1="480" x2="600" y2="480" stroke="#666"/>'
        + '<text x="50" y="510" font-size="12" fill="#666">· LDL-C 略高于本次随访目标(1.8 mmol/L)</text>'
        + '<text x="50" y="530" font-size="12" fill="#666">· 已服用阿托伐他汀 20mg qN,本次结果提示控制力度可能不足</text>'
        + '<text x="50" y="680" font-size="13">检验者:<tspan font-style="italic">检验师 · 张</tspan></text>'
        + '<text x="50" y="705" font-size="13">审核者:<tspan font-style="italic">主任技师 · 王</tspan></text>'
        + '<text x="50" y="730" font-size="13">报告日期:2025-12-29 10:30</text>'
        + '<text x="320" y="850" text-anchor="middle" font-size="11" fill="#999">— 本报告单仅供临床医生参考 —</text>'
        + '</svg>';
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    function enlargeReport() {
      var src = document.getElementById('reportThumb').src;
      if (!src) return;
      // 简单用 window.open 看大图(避免重复 lightbox 代码)
      var w = window.open('', '_blank');
      if (w) {
        w.document.write('<title>报告放大</title><body style="margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;"><img src="' + src + '" style="max-width:100%;max-height:100vh;"/></body>');
      }
    }

    // ─────────────────────────────────────────────
    // 渲染
    // ─────────────────────────────────────────────
    (function () {
      var d = DATA[TYPE] || DATA.bp;
      document.getElementById('content').innerHTML = d.html;
      document.getElementById('pageTitle').textContent = d.title;
      // upload 类型:注入报告图
      if (TYPE === 'upload') {
        var img = document.getElementById('reportThumb');
        if (img) img.src = buildReportSVG();
      }
    })();
  </script>
</body>
</html>
