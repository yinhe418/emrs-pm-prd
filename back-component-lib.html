<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务组件库 · 后台管理</title>
  <link rel="stylesheet" href="assets/back.css">
</head>
<body data-page="component" data-crumb='[{"name":"后台管理"},{"name":"任务组件库"}]'>

<main class="back-main">

  <div class="page-head">
    <h1>任务组件库</h1>
    <div class="sub">每个组件定义一组录入字段。字段的<b>标准范围</b>由科室在本组件上配置,决定能不能填。</div>
  </div>

  <div id="scopeStrip"></div>

  <div class="note note-info">
    <img src="assets/icons-png/icon-info.png">
    <div><b>每个字段由四件事决定:</b>字段名 / 字段类型 / 标准范围 / 是否必填。<br>
      <b>标准范围</b>是科室在本组件上填的配置项,下限与上限<b>各自独立</b>,留空 = 该侧不限。<br>
      录入值还需通过临床有效区间校验(系统内部判定、不在本页展示),超出即禁止提交。</div>
  </div>

  <div class="tabs" data-tab-group="c" data-scope="cScope">
    <button data-tab="all" class="active">全部组件 <span class="cnt grey" id="cntAll">0</span></button>
    <button data-tab="off">已停用 <span class="cnt grey" id="cntOff">0</span></button>
  </div>

  <div class="filters">
    <div class="search-wrap">
      <img src="assets/icons-png/icon-search.png" alt="">
      <input class="ipt search-ipt" id="kw" placeholder="组件名称">
    </div>
    <select class="sel" id="fDept"><option value="">归属科室:全部</option></select>
    <span class="ml-auto"></span>
    <a class="btn btn-primary" href="back-component-edit.html"><img src="assets/icons-png/icon-plus.png" alt="">新建组件</a>
  </div>

  <div class="card flat">
    <div class="tbl-wrap">
      <table class="tbl">
        <thead>
          <tr>
            <th style="width:190px">组件名称</th>
            <th style="width:150px">归属科室</th>
            <th style="width:150px">字段构成</th>
            <th style="width:110px">被引用</th>
            <th style="width:80px">状态</th>
            <th class="col-act" style="width:176px">操作</th>
          </tr>
        </thead>
        <tbody id="body"></tbody>
      </table>
    </div>
    <div class="pager">
      <span>共 <b id="n">0</b> 个组件</span>
      <span class="pg-right">点击「编辑」配置字段定义</span>
    </div>
  </div>
</main>

<div class="modal-mask" id="stopModal">
  <div class="modal">
    <div class="modal-head">
      <img src="assets/icons-png/icon-warning.png" alt="">
      <h3>停用组件</h3>
    </div>
    <div class="modal-body" id="stopBody"></div>
    <div class="modal-foot">
      <button class="btn btn-default" onclick="Back.modal('stopModal',false)">取消</button>
      <button class="btn btn-danger" id="stopOk">确认停用</button>
    </div>
  </div>
</div>

<script src="assets/back-data.js"></script>
<script src="assets/back-layout.js"></script>
<script>
  Back.bindTabs('[data-tab-group="c"]');
  var tab = '';

  /* ⚠️ id 数值化:组件 id 已是数字(原 'T1' / 'T2' → 1 / 2)。
   *    「被几个任务模板引用」的口径写死在前两个组件上,这里做容错比较。 */
  function isCoreComponent(c) {
    return String(c.id) === '1' || String(c.id) === '2';
  }

  (function () {
    var s = document.getElementById('fDept');
    BACK_DATA.departments.forEach(function (d) {
      var h = BACK_DATA.hospital(d.hospitalId);
      s.insertAdjacentHTML('beforeend',
        '<option value="' + d.id + '">' + (h ? h.short + ' · ' : '') + d.name + '</option>');
    });
  })();

  function filtered() {
    var kw = document.getElementById('kw').value.trim();
    var fd = document.getElementById('fDept').value;
    return Back.hospFilter(BACK_DATA.components, 'components').filter(function (c) {
      if (kw && c.name.indexOf(kw) < 0) return false;
      /* ⚠️ id 数值化:<select>.value 是字符串,departmentId 是数字,必须容错比较 */
      if (fd && String(c.departmentId) !== String(fd)) return false;
      /* ⚠️ tab === 'off' 是 **Tab 标签 id**(data-tab="off"),不是 status —— 别一起改掉;
       *    status 才是数字:1 启用 / 0 停用 */
      if (tab === 'off' && c.status !== 0) return false;
      if (tab !== 'off' && c.status === 0) return false;
      return true;
    });
  }

  function render() {
    var pool = Back.hospFilter(BACK_DATA.components, 'components');
    var rows = filtered();
    document.getElementById('n').textContent = rows.length;
    document.getElementById('cntAll').textContent =
      pool.filter(function (c) { return c.status === 1; }).length;
    document.getElementById('cntOff').textContent =
      pool.filter(function (c) { return c.status === 0; }).length;

    document.getElementById('body').innerHTML = rows.length ? rows.map(function (c) {
      var req = c.fields.filter(function (f) { return f.req === 'required'; }).length;
      var d = BACK_DATA.dept(c.departmentId);
      var refs = isCoreComponent(c) ? 2 : 1;
      return '<tr' + (c.status === 0 ? ' class="row-muted"' : '') + '>'
        + '<td><div class="cell-user"><span class="av-xs" style="background:var(--brand-light)">'
        +   '<img src="' + (c.iconImg || 'assets/icons-png/' + c.icon + '.png') + '" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover"></span>'
        +   '<div><div class="cell-main">' + c.name + '</div></div></div></td>'
        + '<td class="fz-12">' + (d ? d.name : '—') + '</td>'
        + '<td class="fz-12">' + c.fields.length + ' 个字段<br><span class="cell-sub">必填 ' + req
        +   ' · 选填 ' + c.fields.filter(function (f) { return f.req === 'optional'; }).length
        +   ' · 自动 ' + c.fields.filter(function (f) { return f.req === 'auto'; }).length + '</span></td>'
        + '<td class="fz-12 num-cell">' + refs + ' 个任务模板</td>'
        + '<td>' + Back.onOff(c.status) + '</td>'
        + '<td class="col-act">'
        +   '<a class="btn-text" href="back-component-edit.html?id=' + c.id + '">编辑</a>'
        +   (c.status === 1
              ? '<a class="btn-text danger" data-stop="' + c.id + '">停用</a>'
              : '<a class="btn-text" data-en="' + c.id + '">启用</a>')
        + '</td></tr>';
    }).join('')
    : '<tr><td colspan="7"><div class="empty"><img src="assets/icons-png/icon-empty-box.png" alt="">'
      + '<div class="e-t">' + (tab === 'off' ? '没有已停用的组件' : '没有符合条件的组件') + '</div>'
      + '<div class="e-d">' + (tab === 'off'
          ? '组件只会停用、不会物理删除,停用后会出现在这里' : '试试调整筛选条件,或新建一个组件') + '</div></div></td></tr>';
  }

  document.querySelector('[data-tab-group="c"]').addEventListener('click', function () {
    var b = this.querySelector('button.active');
    if (b) { tab = b.getAttribute('data-tab'); render(); }
  });

  document.body.addEventListener('click', function (e) {
    var g = function (a) { return e.target.getAttribute && e.target.getAttribute(a); };
    if (g('data-en')) {
      BACK_DATA.byId(BACK_DATA.components, g('data-en')).status = 1;
      render(); return Back.toast('已启用组件', 'ok');
    }
    if (g('data-stop')) {
      var c = BACK_DATA.byId(BACK_DATA.components, g('data-stop'));
      document.getElementById('stopBody').innerHTML =
        '<div>停用「' + c.name + '」后:</div><ul>'
        + '<li>患者端不再下发<b>新的</b>该组件任务</li>'
        + '<li><b>已下发未完成</b>的任务保留,字段标记「已停用」只读</li>'
        + '<li>历史数据<b>全部保留</b>,不物理删除</li></ul>'
        + '<div class="note note-warn" style="margin-top:10px"><img src="assets/icons-png/icon-warning.png">'
        + '<div>该组件被 <b>' + (isCoreComponent(c) ? 2 : 1)
        + '</b> 个任务模板引用,<b>仍有进行中的任务</b>。停用后这些任务需要先解除引用,或接受任务被保留为只读。</div></div>';
      document.getElementById('stopOk').onclick = function () {
        c.status = 0; Back.modal('stopModal', false); render();
        Back.toast('已停用:' + c.name, 'warn');
      };
      Back.modal('stopModal', true);
    }
  });

  ['kw', 'fDept'].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener('input', render);
    el.addEventListener('change', render);
  });

  if (Back.qs('tab')) {
    tab = Back.qs('tab');
    var b = document.querySelector('[data-tab="' + tab + '"]');
    if (b) b.classList.add('active');
  }

  if (!Back.requireHospitalAndApply()) { document.querySelector('.back-main').innerHTML = ''; }
  else { document.getElementById('scopeStrip').innerHTML = Back.scopeStrip('组件库按本院过滤'); }
  render();
</script>
</body>
</html>
