<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上传复查报告</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app">
    <div class="navbar">
      <button class="back" onclick="location.href='patient-tasks.html'"><span style="font-size:22px; font-weight:700; line-height:1;">‹</span></button>
      <div class="title">上传复查报告</div>
      <div class="actions"></div>
    </div>

    <div class="page">
      <div class="banner">
        <b>LDL-C 复查 · D30</b>
        请上传包含<b>检查日期 + 检查机构 + 原报告</b>的清晰照片。
      </div>

      <div class="card" style="background:var(--block-bg); border:none;">
        <div style="font-size:13px; color:var(--block);">
          <b>已逾期 2 天</b> · 截止 2025-12-31
        </div>
      </div>

      <div class="section-title">本次复查信息</div>
      <div class="group">
        <div class="form-item">
          <span class="form-label"><span class="req">*</span>复查项目</span>
          <select class="form-select">
            <option>LDL-C</option>
            <option>血脂全套</option>
            <option>颈动脉超声</option>
            <option>血压记录</option>
          </select>
        </div>
        <div class="form-item">
          <span class="form-label"><span class="req">*</span>检查日期</span>
          <input class="form-input" type="date">
        </div>
        <div class="form-item">
          <span class="form-label"><span class="req">*</span>检查机构</span>
          <input class="form-input" placeholder="如:H 市第一医院">
        </div>
        <div class="form-item">
          <span class="form-label"><span class="req">*</span>关键数值(选填)</span>
          <input class="form-input" type="number" step="0.01" placeholder="如 LDL-C 1.8 mmol/L">
        </div>
      </div>

      <div class="section-title">上传报告照片</div>
      <div class="card" style="text-align:center; border:2px dashed var(--brand); background:var(--brand-light);">
        <div style="color:var(--brand); margin-bottom:8px;"><span style="font-size:14px; font-weight:400; line-height:1;">·</span></div>
        <div style="font-size:13px; color:var(--brand);">点击拍照 / 从相册选择</div>
        <div style="font-size:11px; color:var(--ink-3); margin-top:4px;">最多 5 张 · 支持 jpg/png/pdf</div>
      </div>

      <div class="card" style="margin-top:12px;">
        <div class="card-title">已上传(2)</div>
        <div class="feed-item">
          <div class="meta">2025-12-29 · H 市第一医院</div>
          <div class="body">血脂全套.jpg · LDL-C 1.95 mmol/L</div>
        </div>
      </div>

      <div class="card" style="background:var(--info-bg); border:none;">
        <div style="font-size:12px; color:var(--info);">
          上传后由医护确认是否可用(C10)。仅"一张找不到日期的照片"不会被采用。
        </div>
      </div>

      <a href="patient-tasks.html" class="btn btn-primary btn-block" style="margin-top:20px;">
        提交上传
      </a>
    </div>
  </div>
  <script src="assets/layout.js"></script>
</body>
</html>
