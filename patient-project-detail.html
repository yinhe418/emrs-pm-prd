<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目详情</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app">
    <div class="navbar">
      <button class="back" onclick="location.href='patient-home.html'"><span style="font-size:22px; font-weight:700; line-height:1;">‹</span></button>
      <div class="title">项目详情</div>
      <div class="actions">
        <div class="font-toggle" id="fontToggle" aria-label="字号切换">
          <button data-size="normal" onclick="setFontSize('normal', this)">小</button>
          <button data-size="large" onclick="setFontSize('large', this)">中</button>
          <button data-size="xl" onclick="setFontSize('xl', this)">大</button>
        </div>
      </div>
    </div>

    <div class="page" style="padding-top:0;">
      <!-- 项目头部(JS 渲染) -->
      <div id="projectHeader" class="project-header">
        <div class="name">
          <b id="projName">加载中…</b>
          <div class="meta" id="projMeta"></div>
        </div>
        <div id="projPrice"></div>
      </div>

      <div class="page" style="padding:16px;">
        <!-- 项目状态(JS 渲染) -->
        <div id="projStatus" style="margin-bottom:16px;"></div>

        <!-- 项目描述 -->
        <div class="section-title">项目介绍</div>
        <div class="project-detail-desc" id="projDesc">
          加载中…
        </div>

        <!-- 包含的服务 -->
        <div class="section-title">本项目包含</div>
        <div class="card">
          <div id="projIncludes" style="font-size:13px; color:var(--ink-2); line-height:1.8;">
            加载中…
          </div>
        </div>

        <!-- 重要说明 -->
        <div class="card" style="background:var(--info-bg); border:none;">
          <div style="font-size:12px; color:var(--info);">
            <b>请知悉</b>:本软件是您的随访助手,<b>不是 24 小时监护</b>(C2)。
            工作时段 8:00 - 17:00 内的咨询会有护士跟进;夜间 / 周末留言,工作日首次回应;
            <b>紧急情况立即 120</b>,不等线上答复。
          </div>
        </div>

        <!-- 浮动 CTA(JS 渲染) -->
        <div class="floating-cta" id="projCTA">
          <!-- 购买 / 已签约按钮 -->
        </div>

        <!-- 维护说明 -->
        <div class="admin-note">
          项目详情由维护人员(admin)在「项目管理」页面配置<br>
          本页为 Demo · 价格 / 服务内容以实际医院告知为准
        </div>
      </div>
    </div>

    <div class="tabbar">
      <a href="patient-home.html" class="tab active"><span><img src="assets/icons-png/icon-tab-home.png" alt="首" /></span>首页</a>
      <a href="patient-tasks.html" class="tab"><span><img src="assets/icons-png/icon-tab-tasks.png" alt="任" /></span>任务</a>
      <a href="patient-im.html" class="tab"><span><img src="assets/icons-png/icon-im.png" alt="信" /></span>联系</a>
      <a href="patient-emergency.html" class="tab danger"><span><img src="assets/icons-png/icon-sos.png" alt="急" /></span>紧急</a>
    </div>
  </div>
  <script src="assets/layout.js"></script>
  <script src="assets/font-size.js"></script>
  <script src="assets/projects.js"></script>
  <script>
    (function () {
      // 解析 URL 参数
      var id = '90d_health';
      try {
        var qs = location.search.replace(/^\?/, '');
        if (qs) {
          qs.split('&').forEach(function (kv) {
            var p = kv.split('=');
            if (p[0] === 'id' && p[1]) id = decodeURIComponent(p[1]);
          });
        }
      } catch (e) {}

      var proj = PROJECT_HELPERS.getProject(id);
      if (!proj) {
        document.getElementById('projName').textContent = '未找到该项目';
        document.getElementById('projDesc').textContent = '项目可能已下线,请回到首页查看其他项目。';
        document.getElementById('projIncludes').textContent = '—';
        document.getElementById('projCTA').innerHTML =
          '<a href="patient-home.html" class="btn btn-primary btn-block">回到首页</a>';
        return;
      }

      var subscribed = PROJECT_HELPERS.isSubscribed(id);

      // 顶部
      document.getElementById('projName').textContent = proj.name;
      document.getElementById('projMeta').innerHTML =
        '<span>' + proj.duration + '</span> · <span>' + proj.tag + '</span>';

      var priceHtml = subscribed
        ? '<span class="project-price-badge subscribed">已签约</span>'
        : '<span class="project-price-large">' + proj.priceLabel + '</span>';
      document.getElementById('projPrice').innerHTML = priceHtml;

      // 描述
      document.getElementById('projDesc').textContent = proj.description;

      // 包含的服务(根据 id 简单 mock)
      var includesMap = {
        '90d_health':
          '• 每日任务提醒(血压 / 用药反馈)<br>'
          + '• 3 次主动电话回访(D7 / D30 / D90)<br>'
          + '• 个人目标核对与必要的报告上传<br>'
          + '• 异常时的工作时段沟通',
        'carotid':
          '• 12 月 LDL-C 跟踪(每 3 月 1 次)<br>'
          + '• 颈动脉超声随访<br>'
          + '• 研究者资格确认<br>'
          + '• 脱敏资料分析(严格保密)',
        '365d_health':
          '• 365 天血压 / 血脂全程随访<br>'
          + '• 生活方式干预与记录<br>'
          + '• 高复发期重点关注<br>'
          + '• 价格待定(医院 / 科室确认)'
      };
      document.getElementById('projIncludes').innerHTML = includesMap[id] || '—';

      // CTA
      var ctaHtml;
      if (subscribed) {
        ctaHtml =
          '<a href="patient-home.html" class="btn btn-primary btn-block btn-lg">回到首页看任务</a>';
      } else {
        ctaHtml =
          '<div style="text-align:center; margin-bottom:10px;">'
          + '<a href="patient-privacy.html?id=' + encodeURIComponent(id) + '" '
          + 'style="color:var(--ink-3); font-size:12px; text-decoration:underline;">'
          + '阅读《隐私协议》</a>'
          + '</div>'
          + '<label style="display:flex; align-items:flex-start; gap:8px; '
          + 'padding:12px; background:var(--bg); border-radius:8px; '
          + 'margin-bottom:12px; cursor:pointer; line-height:1.5;">'
          + '<input type="checkbox" id="agreePrivacy" onclick="toggleAgree()" '
          + 'style="margin-top:2px; flex-shrink:0;">'
          + '<span style="font-size:13px; color:var(--ink-2);">'
          + '我已阅读并同意'
          + '<a href="patient-privacy.html?id=' + encodeURIComponent(id) + '" '
          + 'style="color:var(--brand); text-decoration:none;">《隐私协议》</a>'
          + '</span>'
          + '</label>'
          + '<button type="button" id="buyBtn" disabled '
          + 'class="btn btn-block btn-lg" '
          + 'style="background:var(--line); color:var(--ink-3); '
          + 'cursor:not-allowed; border:none;" '
          + 'onclick="goBuy()">'
          + '购买服务 ' + proj.priceLabel + ' ›</button>';
      }
      document.getElementById('projCTA').innerHTML = ctaHtml;

      // 顶部 navbar title 同步
      document.querySelector('.navbar .title').textContent = proj.name;
    })();

    // 勾选隐私协议 → 解锁购买按钮
    function toggleAgree() {
      var cb = document.getElementById('agreePrivacy');
      var btn = document.getElementById('buyBtn');
      if (!cb || !btn) return;
      btn.disabled = !cb.checked;
      if (cb.checked) {
        btn.style.background = 'var(--block)';
        btn.style.color = 'white';
        btn.style.cursor = 'pointer';
      } else {
        btn.style.background = 'var(--line)';
        btn.style.color = 'var(--ink-3)';
        btn.style.cursor = 'not-allowed';
      }
    }

    // 购买服务 → mock 支付页
    function goBuy() {
      var cb = document.getElementById('agreePrivacy');
      if (cb && !cb.checked) return;
      var qs = location.search.replace(/^\?/, '');
      var id = '90d_health';
      try {
        if (qs) {
          qs.split('&').forEach(function (kv) {
            var p = kv.split('=');
            if (p[0] === 'id' && p[1]) id = decodeURIComponent(p[1]);
          });
        }
      } catch (e) {}
      location.href = 'patient-pay.html?id=' + encodeURIComponent(id);
    }
  </script>
</body>
</html>
