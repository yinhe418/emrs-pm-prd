<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>参与研究项目</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app">
    <div class="navbar">
      <button class="back" onclick="location.href='patient-home.html'"><span style="font-size:22px; font-weight:700; line-height:1;">‹</span></button>
      <div class="title">参与研究项目</div>
      <div class="actions"></div>
    </div>

    <div class="page">
      <div class="banner" style="background:var(--purple-bg); color:var(--purple);">
        <b style="color:var(--purple);">P1 占位</b>
        颈动脉斑块管理研究 · 详细流程在后续版本展开
      </div>

      <div class="card">
        <div class="card-title">颈动脉斑块管理研究</div>
        <div style="font-size:13px; color:var(--ink-2); line-height:1.7;">
          • 适用人群:门诊/住院卒中及 ASCVD 高危人群<br>
          • 纳入条件: ≥40 岁、超声明确斑块、有基线 LDL-C、签知情同意<br>
          • 周期:12 个月随访 + 数字化管理<br>
          • 参与由研究者确认资格,<b>不能根据单一检查结果自动入组</b>
        </div>
      </div>

      <div class="card" style="background:var(--info-bg); border:none;">
        <div style="font-size:12px; color:var(--info);">
          <b>关键点</b>(S5):可同时参加 90 天管理 + 本研究;<br>
          退出其中一项,其他已同意的必要服务不应随之取消。
        </div>
      </div>

      <div class="section-title">知情同意(模拟)</div>
      <div class="card">
        <label style="display:flex; align-items:flex-start; gap:10px; padding:8px 0;">
          <input type="checkbox">
          <span style="font-size:13px; line-height:1.6;">
            我已阅读并理解研究目的、可能的获益与风险,愿意接受 12 个月随访和数字化管理。
          </span>
        </label>
      </div>

      <a href="patient-home.html" class="btn btn-primary btn-block" style="margin-top:20px;">
        签署并加入研究
      </a>
      <a href="patient-home.html" class="btn btn-outline btn-block" style="margin-top:8px;">
        暂不加入
      </a>

      <div class="card" style="background:var(--warn-bg); border:none; margin-top:12px;">
        <div style="font-size:12px; color:var(--warn);">
          <b>资助方不直接接触患者营销名单</b>(§2.1)。研究数据按医院伦理要求保护身份。
        </div>
      </div>
    </div>
  </div>
  <script src="assets/layout.js"></script>
</body>
</html>
