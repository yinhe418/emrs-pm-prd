<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目付费</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app">
    <div class="navbar">
      <button class="back" onclick="goBack()"><span style="font-size:22px; font-weight:700; line-height:1;">‹</span></button>
      <div class="title" id="pageTitle">项目付费</div>
      <div class="actions"></div>
    </div>

    <div class="page">
      <div class="banner banner-info">
        <b>确认加入即完成入组</b>
      </div>

      <div class="section-title">项目</div>
      <div class="card">
        <div class="kv"><span class="k">项目</span><span class="v" id="orderName">—</span></div>
        <div class="kv"><span class="k">周期</span><span class="v" id="orderDuration">—</span></div>
        <div class="kv"><span class="k">价格</span><span class="v" id="orderUnitPrice">—</span></div>
        <div class="divider"></div>
        <div class="kv" style="font-size:18px;">
          <span class="k" style="color:var(--ink); font-weight:600;">费用</span>
          <span class="v" style="color:var(--block); font-weight:700;" id="orderTotal">—</span>
        </div>
      </div>

      <div class="card" style="background:#FFF8E1; border:none; margin-top:12px;">
        <div style="font-size:12px; color:#8D6E00; line-height:1.6;">
          <b>本期不接真实支付</b>:本页为流程占位,<b>不会发起扣款</b>。<br>
          价格仅作展示,实际费用以医院 / 科室线下告知为准。
        </div>
      </div>

      <div class="card" style="background:var(--info-bg); border:none; margin-top:12px;">
        <div style="font-size:12px; color:var(--info); line-height:1.6;">
          <b>确认加入后</b>:本项目任务会立即出现在首页(至少包含今天),IM 联系 / 上传报告权限同步开通。
        </div>
      </div>

      <button class="btn btn-primary btn-block btn-lg" style="margin-top:20px;" id="payBtn" onclick="confirmJoin(event)">
        <span id="payBtnText">确认加入</span>
      </button>
      <div style="margin-top:10px; font-size:11px; color:var(--ink-3); text-align:center;" id="payHint">
        请确认信息后点击「确认加入」
      </div>
    </div>
  </div>
  <script src="assets/layout.js"></script>
  <script src="assets/projects.js"></script>
  <script>
    var PROJ_ID = '90d_health';
    function getProjId() {
      try {
        var qs = location.search.replace(/^\?/, '');
        if (qs) {
          qs.split('&').forEach(function (kv) {
            var p = kv.split('=');
            if (p[0] === 'id' && p[1]) PROJ_ID = decodeURIComponent(p[1]);
          });
        }
      } catch (e) {}
      return PROJ_ID;
    }
    function goBack() {
      // 回签署须知(上一步);未签署时也可回项目详情
      location.href = 'patient-signature.html?id=' + encodeURIComponent(getProjId());
    }
    /* 🔴 2026-11-05 用户拍板(D33):本期不接支付网关。
     *    本页只是流程占位 —— 点「确认加入」= 入组,不发起任何扣款。 */
    function confirmJoin(e) {
      e.preventDefault();
      var btn = document.getElementById('payBtn');
      var txt = document.getElementById('payBtnText');
      btn.disabled = true;
      btn.style.cursor = 'wait';
      txt.textContent = '正在加入…';
      setTimeout(function () {
        try {
          var id = getProjId();
          // 入组标记(本期无支付 / 无订单 / 无金额)
          localStorage.setItem('emrs_project_joined_' + id, '1');
          localStorage.setItem('emrs_project_joined_time_' + id, new Date().toISOString());
          // 已入组列表(home 用它判断是否显示任务)
          PROJECT_HELPERS.subscribe(id);
        } catch (e2) {}
        btn.style.background = '#2E7D32';
        btn.style.cursor = 'pointer';
        /* 成功态允许立即进入(不再扣款 / 不再触发入组) */
        btn.disabled = false;
        btn.onclick = function (ev) { if (ev) ev.preventDefault(); location.href = 'patient-home.html'; };
        var n = 3;
        var hint = document.getElementById('payHint');
        function tick() {
          if (n > 0) {
            txt.textContent = '入组成功 · ' + n + ' 秒后进入首页看今日任务';
            if (hint) hint.textContent = '点击下方按钮可立即进入';
            n--;
            setTimeout(tick, 1000);
          } else {
            location.href = 'patient-home.html';
          }
        }
        tick();
      }, 800);
    }

    // 立即进入(跳过倒计时)
    function skipCountdown() {
      location.href = 'patient-home.html';
    }
    // 启动时回填项目信息
    (function () {
      var id = getProjId();
      var p = PROJECT_HELPERS.getProject(id);
      if (p) {
        document.getElementById('orderName').textContent = p.name;
        document.getElementById('orderDuration').textContent = p.duration;
        document.getElementById('orderUnitPrice').textContent = p.priceLabel;
        document.getElementById('orderTotal').textContent = p.priceLabel;
        document.getElementById('payBtnText').textContent = '确认加入';
        document.getElementById('pageTitle').textContent = '确认加入 · ' + p.name;
      }
    })();
  </script>
</body>
</html>
