<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目付费</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app">
    <div class="navbar">
      <button class="back" onclick="goBack()"><span style="font-size:22px; font-weight:700; line-height:1;">‹</span></button>
      <div class="title" id="pageTitle">项目付费</div>
      <div class="actions"></div>
    </div>

    <div class="page">
      <div class="banner banner-info">
        <b>付款成功即开通服务</b>
      </div>

      <div class="section-title">订单</div>
      <div class="card">
        <div class="kv"><span class="k">项目</span><span class="v" id="orderName">—</span></div>
        <div class="kv"><span class="k">周期</span><span class="v" id="orderDuration">—</span></div>
        <div class="kv"><span class="k">单价</span><span class="v" id="orderUnitPrice">—</span></div>
        <div class="divider"></div>
        <div class="kv" style="font-size:18px;">
          <span class="k" style="color:var(--ink); font-weight:600;">应付</span>
          <span class="v" style="color:var(--block); font-weight:700;" id="orderTotal">—</span>
        </div>
      </div>

      <div class="section-title">支付方式</div>
      <div class="group">
        <label class="cell" style="background:var(--pass-bg);">
          <div class="l">
            <div class="icon" style="background:white; color:var(--pass);">微</div>
            <div class="info"><b>微信支付</b><span>本期 Mock · 推荐</span></div>
          </div>
          <div class="r"><input type="radio" name="pay" checked></div>
        </label>
        <label class="cell" style="opacity:0.55;">
          <div class="l">
            <div class="icon" style="background:#ECEFF1; color:#607D8B;">银</div>
            <div class="info"><b>银行卡 / 院内账户</b><span>本期未对接</span></div>
          </div>
          <div class="r"><input type="radio" name="pay" disabled></div>
        </label>
      </div>

      <div class="card" style="background:var(--info-bg); border:none;">
        <div style="font-size:12px; color:var(--info);">
          <b>付费后</b>:本项目任务将在首页显示,IM 联系 / 上传报告权限同步开通。<br>
          <b>退款规则</b>(Q-PAY-2):待定 — 本期占位,实际不发起真实扣款。
        </div>
      </div>

      <button class="btn btn-primary btn-block btn-lg" style="margin-top:20px;" id="payBtn" onclick="mockPay(event)">
        <span id="payBtnText">微信支付 —</span>
      </button>
      <div style="margin-top:10px; font-size:11px; color:var(--ink-3); text-align:center;" id="payHint">
        请确认订单信息后点击支付
      </div>

      <div class="card" style="margin-top:16px; background:#FFF8E1; border:none;">
        <div style="font-size:12px; color:#8D6E00;">
          <b>价格说明</b>(§13.1):90 天 = 100 元 / 180 天 = 200 元 / 365 天 = 待定。<br>
          实际价格由医院 / 科室在使用前确定(C8 类比)。
        </div>
      </div>
    </div>
  </div>
  <script src="assets/layout.js"></script>
  <script src="assets/projects.js"></script>
  <script>
    var PROJ_ID = '90d_health';
    function getProjId() {
      try {
        var qs = location.search.replace(/^\?/, '');
        if (qs) {
          qs.split('&').forEach(function (kv) {
            var p = kv.split('=');
            if (p[0] === 'id' && p[1]) PROJ_ID = decodeURIComponent(p[1]);
          });
        }
      } catch (e) {}
      return PROJ_ID;
    }
    function goBack() {
      // 新流程:支付前从项目详情进入(勾选同意后),回项目详情
      location.href = 'patient-project-detail.html?id=' + encodeURIComponent(getProjId());
    }
    function mockPay(e) {
      var btn = document.getElementById('payBtn');
      var txt = document.getElementById('payBtnText');
      btn.disabled = true;
      btn.style.cursor = 'wait';
      txt.textContent = '支付中…';
      setTimeout(function () {
        try {
          var id = getProjId();
          // 写 per-project 付费标记
          localStorage.setItem('emrs_project_paid_' + id, '1');
          localStorage.setItem('emrs_project_paid_amount_' + id, '100');
          localStorage.setItem('emrs_project_paid_time_' + id, new Date().toISOString());
          // 加入已订阅列表(home 用它判断是否显示任务)
          PROJECT_HELPERS.subscribe(id);
        } catch (e2) {}
        // 成功态
        btn.style.background = '#2E7D32';
        btn.style.cursor = 'default';
        // 倒计时 3 → 2 → 1 → 跳转
        var n = 3;
        var hint = document.getElementById('payHint');
        function tick() {
          if (n > 0) {
            txt.textContent = '支付成功 · ' + n + ' 秒后进入首页';
            if (hint) hint.textContent = '点击下方按钮可立即进入';
            n--;
            setTimeout(tick, 1000);
          } else {
            location.href = 'patient-home.html';
          }
        }
        tick();
      }, 2000);
    }

    // 立即进入(跳过倒计时)
    function skipCountdown() {
      location.href = 'patient-home.html';
    }
    // 启动时回填项目信息
    (function () {
      var id = getProjId();
      var p = PROJECT_HELPERS.getProject(id);
      if (p) {
        document.getElementById('orderName').textContent = p.name;
        document.getElementById('orderDuration').textContent = p.duration;
        document.getElementById('orderUnitPrice').textContent = p.priceLabel;
        document.getElementById('orderTotal').textContent = p.priceLabel;
        document.getElementById('payBtnText').textContent = '微信支付 ' + p.priceLabel;
        document.getElementById('pageTitle').textContent = '付费 · ' + p.name;
      }
    })();
  </script>
</body>
</html>
